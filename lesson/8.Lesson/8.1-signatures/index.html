        font:
          italic 15px Charter,
          Georgia,
          serif;
        fill: var(--ink);

        font:
          12px system-ui,
          sans-serif;
        letter-spacing: 0.1em;
        fill: var(--mut);
      }
      .book-scene svg text.nm {
        font:
          500 15px system-ui,
          sans-serif;
        fill: var(--ink);
      }
      .book-scene svg text.nm.a {
        fill: var(--acc);
      }
      .book-scene svg text.seal {
        font:
          600 22px Charter,
          Georgia,
          serif;
        fill: var(--bg);

        font:
          600 13px ui-monospace,
          Menlo,
          Consolas,
          monospace;
        fill: var(--bg);
      }
      .sc-fade {
        animation: fade 0.8s both;
      }
      .sc-pop {
        transform-box: fill-box;
        transform-origin: center;
        animation: pop 0.5s both cubic-bezier(0.3, 1.6, 0.5, 1);
      }
      .sc-stamp {
        animation: stampDown 2.2s ease-in-out both;
      }
      @keyframes stampDown {
        0% {
          transform: translateY(-80px);
          opacity: 0;
        }
        30% {
          opacity: 1;
        }
        50%,
        65% {
          transform: translateY(0);
        }
        100% {
          transform: translateY(-80px);
          opacity: 0;
        }
      }
      .sc-clone {
        animation: cloneMove 2.6s ease-in-out 0.6s both;
      }
      @keyframes cloneMove {
        from {
          transform: translate(0, 0);
        }
        to {
          transform: translate(282px, 6px);
        }
      }
      .sc-left {
        animation: splitL 1.3s 0.3s ease-out both;
      }
      .sc-right {
        animation: splitR 1.3s 0.3s ease-out both;
      }
      @keyframes splitL {
        from {
          transform: translateX(100px);
        }
        to {
          transform: none;
        }
      }
      @keyframes splitR {
        from {
          transform: translateX(-100px);
        }
        to {
          transform: none;
        }
      }
      .sc-draw {
        stroke-dasharray: 440;
        stroke-dashoffset: 440;
        animation: draw 2.6s ease-out forwards;
      }
      @keyframes draw {
        to {
          stroke-dashoffset: 0;
        }
      }
      .sc-fly {
        animation: fly 1.8s ease-in-out 0.4s both;
      }
      @keyframes fly {
        from {
          transform: translateX(0);
        }
        to {
          transform: translateX(140px);
        }
      }

        display: flex;
        flex-wrap: wrap;
        gap: 10px 14px;
        align-items: end;
        margin: 10px 0;
      }
      .lab label.f {
        font:
          13px system-ui,
          sans-serif;
        color: var(--mut);
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .lab input[type="text"],
      .lab select {
        font:
          15px system-ui,
          sans-serif;
        background: var(--bg);
        color: var(--ink);
        border: 1px solid var(--line);
        border-radius: 4px;
        padding: 7px 10px;
      }
      .lab .small {
        font:
          13px system-ui,
          sans-serif;
        color: var(--mut);
      }
      .lab button.ghost[aria-pressed="true"] {
        background: var(--acc);
        border-color: var(--acc);
        color: var(--bg);
      }
      .stations {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 8px;
        margin: 14px 0;
      }
      .st {
        border: 1px solid var(--line);
        background: var(--bg);
        border-radius: 6px;
        padding: 10px;
        min-height: 88px;
        font:
          13px/1.35 system-ui,
          sans-serif;
        transition:
          border-color 0.3s,
          transform 0.3s,
          background 0.3s;
      }
      .st b {
        display: block;
        font-size: 11px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--mut);
      }
      .st code {
        display: block;
        margin-top: 6px;
        font-size: 13px;
        word-break: break-word;
      }
      .st.on {
        border-color: var(--acc);
        background: var(--soft);
        transform: translateY(-3px);
      }
      .st.done {
        border-color: var(--ink);
      }
      .st code.flip {
        animation: flip 0.5s both;
      }
      @keyframes flip {
        from {
          opacity: 0;
          transform: rotateX(90deg);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      .steplog {
        margin: 8px 0 0;
        padding: 0;
        list-style: none;
      }
      .steplog p,
      .steplog li {
        font:
          15px/1.55 system-ui,
          sans-serif;
        margin: 0.4em 0;
        animation: fade 0.5s both;
      }
      .vpaper {
        background: var(--bg);
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 14px 16px;
        font:
          15px system-ui,
          sans-serif;
      }
      .vp-msg {
        font:
          600 19px Charter,
          Georgia,
          serif;
        margin-bottom: 8px;
      }
      .vp-row {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        padding: 5px 0;
        border-top: 1px dashed var(--line);
      }
      .vp-row span {
        color: var(--mut);
      }
      .vp-row b {
        font:
          600 14px ui-monospace,
          Menlo,
          Consolas,
          monospace;
      }
      .bad {
        color: var(--acc);
      }
      .verdict {
        min-height: 70px;
        margin-top: 12px;
      }
      .stamp {
        display: inline-block;
        font:
          700 22px system-ui,
          sans-serif;
        letter-spacing: 0.12em;
        border: 3px solid;
        border-radius: 6px;
        padding: 6px 16px;
        transform: rotate(-4deg);
        animation: stampIn 0.45s both;
      }
      .stamp.ok {
        color: var(--ok);
      }
      .stamp.no {
        color: var(--acc);
      }
      @keyframes stampIn {
        0% {
          opacity: 0;
          transform: scale(2.2) rotate(-12deg);
        }
        70% {
          opacity: 1;
          transform: scale(0.95) rotate(-4deg);
        }
        100% {
          opacity: 1;
          transform: scale(1) rotate(-4deg);
        }
      }
      .login-grid {
        display: grid;
        grid-template-columns: 1fr minmax(90px, 1.2fr) 1fr;
        gap: 8px;
        align-items: center;
        margin: 12px 0;
      }
      .peer {
        border: 1px solid var(--line);
        border-radius: 6px;
        background: var(--bg);
        padding: 10px;
        text-align: center;
        font:
          14px/1.4 system-ui,
          sans-serif;
      }
      .peer small {
        display: block;
        color: var(--mut);
      }
      .lane {
        position: relative;
        height: 34px;
      }
      .lane::before {
        content: "";
        position: absolute;
        left: 0;
        right: 0;
        top: 50%;
        border-top: 1px dashed var(--line);
      }
      .fly {
        position: absolute;
        top: 4px;
        left: 0;
        opacity: 0;
        white-space: nowrap;
        background: var(--acc);
        color: var(--bg);
        border-radius: 99px;
        padding: 4px 10px;
        font:
          600 12px ui-monospace,
          Menlo,
          Consolas,
          monospace;
      }
      .fly.go-r {
        animation: flyR 0.9s ease-in-out both;
      }
      .fly.go-l {
        animation: flyL 0.9s ease-in-out both;
      }
      @keyframes flyR {
        from {
          opacity: 1;
          left: 0;
          transform: none;
        }
        to {
          opacity: 1;
          left: 100%;
          transform: translateX(-100%);
        }
      }
      @keyframes flyL {
        from {
          opacity: 1;
          left: 100%;
          transform: translateX(-100%);
        }
        to {
          opacity: 1;
          left: 0;
          transform: none;
        }
      }
      .feed {
        list-style: none;
        margin: 10px 0 0;
        padding: 0;
      }
      .feed li {
        font:
          14px/1.5 system-ui,
          sans-serif;
        padding: 7px 10px;
        margin: 6px 0;
        border-left: 3px solid var(--line);
        background: var(--bg);
        animation: fade 0.4s both;
      }
      .feed li.ok {
        border-color: var(--ok);
      }
      .feed li.no {
        border-color: var(--acc);
      }
      mark.hl {
        background: var(--acc);
        color: var(--bg);
        border-radius: 3px;
        padding: 0 5px;
      }
      .nt-table td,
      .nt-table th {
        font-size: 15px;
      }
      .nt-reveal {
        text-align: center;
        margin-top: 14px;
      }
      .nt-key {
        display: inline-block;
        font:
          700 20px ui-monospace,
          Menlo,
          Consolas,
          monospace;
        border: 3px solid var(--acc);
        color: var(--acc);
        padding: 8px 18px;
        border-radius: 6px;
        animation: shake 0.6s both;
      }
      @keyframes shake {
        0%,
        100% {
          transform: translateX(0);
        }
        20% {
          transform: translateX(-8px);
        }
        40% {
          transform: translateX(8px);
        }
        60% {
          transform: translateX(-5px);
        }
        80% {
          transform: translateX(5px);
        }
      }
      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin: 10px 0;
      }
      .use h3 {
        font-size: 22px;
        margin: 0.3em 0 0.5em;
        font-weight: 600;
      }
      .use p {
        font-size: 17px;
        margin: 0.6em 0;
      }
      .use-flow {
        display: flex;
        align-items: stretch;
        gap: 0;
        margin: 12px 0;
      }
      .use-flow .node {
        flex: 1;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: var(--bg);
        padding: 10px 12px;
        font:
          14px/1.4 system-ui,
          sans-serif;
      }
      .use-flow .node small {
        display: block;
        font-size: 11px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--acc);
        margin-bottom: 4px;
      }
      .use-flow .wire {
        position: relative;
        flex: 0 0 38px;
      }
      .use-flow .wire::before {
        content: "";
        position: absolute;
        left: 0;
        right: 0;
        top: 50%;
        border-top: 1px dashed var(--mut);
      }
      .use-flow .wire i {
        position: absolute;
        top: calc(50% - 4px);
        left: 0;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--acc);
        animation: travel 1.6s linear infinite;
      }
      @keyframes travel {
        from {
          left: 0;
        }
        to {
          left: calc(100% - 8px);
        }
      }
      @keyframes travelV {
        from {
          top: 0;
        }
        to {
          top: calc(100% - 8px);
        }
      }
      @media (max-width: 560px) {
        .stations {
          grid-template-columns: 1fr 1fr;
        }
        .use-flow {
          flex-direction: column;
        }
        .use-flow .wire {
          flex: 0 0 28px;
        }
        .use-flow .wire::before {
          left: 50%;
          right: auto;
          top: 0;
          bottom: 0;
          border-top: 0;
          border-left: 1px dashed var(--mut);
        }
        .use-flow .wire i {
          left: calc(50% - 4px);
          top: 0;
          animation-name: travelV;
        }
        .book-text {
          min-height: 340px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-delay: 0s !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>

    <script type="module">
      const $ = (s, r = document) => r.querySelector(s);

      const escapeHTML = (s) =>

      // Runs the learner's function by name. Anything other than a plain function is an error.

      // ---------- toy group (P=23, Q=11, G=4) used by the labs ----------
      const TP = 23,
        TQ = 11,
        TG = 4,
        TX = 7,
        TY = 8;
      const tmod = (a) => ((a % TQ) + TQ) % TQ;
      const tpow = (b, e) => {
        let r = 1;
        b %= TP;
        while (e > 0) {
          if (e & 1) r = (r * b) % TP;
          b = (b * b) % TP;
          e >>= 1;
        }
        return r;
      };
      const tinv = (a) => {
        a = tmod(a);
        for (let x = 1; x < TQ; x++) if ((a * x) % TQ === 1) return x;
        return null;
      };
      // Seed 3 makes "Pay Aarav 0.5 BTC" hash to 5, matching Exercise 1.
      const toyHash = (s) => {
        let h = 3;
        for (const c of s) h = (h * 31 + c.charCodeAt(0)) % TQ;
        return h;
      };
      const toySign = (z, x, k) => {
        const R = tpow(TG, k),
          r = R % TQ,
          ki = tinv(k);
        if (!r || ki === null) return null;
        const s = tmod(ki * (z + x * r));
        return s ? { R, r, s, ki } : null;
      };
      const toyVerify = (z, r, s, y) => {
        if (r < 1 || r >= TQ || s < 1 || s >= TQ) return { ok: false };
        const w = tinv(s),
          u1 = tmod(z * w),
          u2 = tmod(r * w);
        const V = (tpow(TG, u1) * tpow(y, u2)) % TP,
          v = V % TQ;
        return { ok: v === r, w, u1, u2, V, v };
      };
      const RM = matchMedia("(prefers-reduced-motion: reduce)").matches;

        SignMachine(el, fin) {
          el.classList.add("try", "lab");
          const names = [
            "Message",
            "Fingerprint",
            "Inside the wallet",
            "Published",
          ];
          const kOpts = Array.from(
            { length: 10 },
            (_, i) =>
              `<option value="${i + 1}"${i === 2 ? " selected" : ""}>${i + 1}</option>`,
          ).join("");
          el.innerHTML = `<span class="label">Try it · The signing machine</span>
            <div class="ctl">
              <label class="f">Message<input type="text" data-msg maxlength="40" value="Pay Aarav 0.5 BTC" /></label>
              <label class="f">Nonce k<select data-k>${kOpts}</select></label>
              <button data-go>Sign it</button>
            </div>
            <div class="stations">${names.map((t, i) => `<div class="st"><b>${i + 1} · ${t}</b><code></code></div>`).join("")}</div>
            <div class="steplog" data-log aria-live="polite"></div>`;
          const st = [...el.querySelectorAll(".st")],
            log = $("[data-log]", el);
          let tok = 0;
          const light = (i, text) => {
            st.forEach((s, j) => {
              s.classList.toggle("on", j === i);
              if (j < i) s.classList.add("done");
            });
            const c = $("code", st[i]);
            c.textContent = text;
            restart(c, "flip");
          };
          const say = (h) => {
            const q = document.createElement("p");
            q.innerHTML = h;
            log.appendChild(q);
          };
          $("[data-go]", el).onclick = async () => {
            const my = ++tok;
            st.forEach((s) => {
              s.classList.remove("on", "done");
              $("code", s).textContent = "";
            });
            log.innerHTML = "";
            const msg = $("[data-msg]", el).value.trim() || "(empty message)",
              k = +$("[data-k]", el).value,
              z = toyHash(msg),
              sg = toySign(z, TX, k);
            light(0, msg);
            say(
              `Meera’s wallet receives the message <b>${escapeHTML(msg)}</b>.`,
            );
            await sleep(900);
            if (my !== tok) return;
            light(1, "z = " + z);
            say(
              `It boils the message down to a short fingerprint, <b>z = ${z}</b>. In real Bitcoin, changing a single letter gives a completely different z. (This toy fingerprint has only 11 possible values. A real one has 2<sup>256</sup>.)`,
            );
            await sleep(1200);
            if (my !== tok) return;
            if (!sg) {
              light(2, "unlucky nonce");
              say(
                `With k = ${k} this message makes <b>s = 0</b>, which is not allowed. Pick another nonce and sign again.`,
              );
              return;
            }
            light(2, `x secret, k = ${k}`);
            say(
              `Inside the wallet, using the private key x = ${TX} (never published):<br>r = (4<sup>${k}</sup> mod 23) mod 11 = ${sg.R} mod 11 = <b>${sg.r}</b><br>s = k⁻¹·(z + x·r) mod 11 = ${sg.ki}·(${z} + ${TX}·${sg.r}) mod 11 = <b>${sg.s}</b>`,
            );
            await sleep(1400);
            if (my !== tok) return;
            light(3, `(r, s) = (${sg.r}, ${sg.s})`);
            st[3].classList.add("done");
            const chk = toyVerify(z, sg.r, sg.s, TY);
            say(
              `Published: the signature <b>(${sg.r}, ${sg.s})</b>. The private key is not in it. A checker who knows only the public key y = ${TY} and z = ${z} gets: <b>${chk.ok ? "valid" : "invalid"}</b>.`,
            );
            say(
              `Change the nonce and sign again. The pair (r, s) changes completely, yet every one of them verifies.`,
            );
            fin();
          };
        },

        VerifyLab(el, fin) {
          el.classList.add("try", "lab");
          const M0 = "Pay Aarav 0.5 BTC",
            M1 = "Pay Mallory 5 BTC",
            sig = toySign(toyHash(M0), TX, 3),
            eveY = tpow(TG, 3),
            on = { msg: false, key: false, sig: false };
          let sawOk = false,
            sawNo = false;
          const toggles = [
            ["msg", "Tamper with the message"],
            ["key", "Check against Eve’s public key"],
            ["sig", "Alter the signature"],
          ];
          el.innerHTML = `<span class="label">Try it · Break the signature</span>
            <div class="vpaper">
              <div class="vp-msg" data-m></div>
              <div class="vp-row"><span>Signature</span><b data-sg></b></div>
              <div class="vp-row"><span>Public key</span><b data-pk></b></div>
            </div>
            <div class="ctl">${toggles.map(([k, t]) => `<button class="ghost" aria-pressed="false" data-t="${k}">${t}</button>`).join("")}<button class="ghost" data-reset>Reset</button></div>
            <ol class="steplog" data-steps aria-live="polite"></ol>
            <div class="verdict" data-verdict></div>`;
          const render = () => {
            const m = on.msg ? M1 : M0,
              z = toyHash(m),
              s = on.sig ? tmod(sig.s + 1) : sig.s,
              y = on.key ? eveY : TY,
              v = toyVerify(z, sig.r, s, y);
            $("[data-m]", el).textContent = m;
            $("[data-m]", el).classList.toggle("bad", on.msg);
            const sgEl = $("[data-sg]", el);
            sgEl.textContent = `(r, s) = (${sig.r}, ${s})`;
            sgEl.classList.toggle("bad", on.sig);
            const pkEl = $("[data-pk]", el);
            pkEl.textContent = on.key
              ? `y = ${y} (Eve’s key)`
              : `y = ${y} (Meera’s key)`;
            pkEl.classList.toggle("bad", on.key);
            const lines = [
              `Fingerprint of the message: <b>z = ${z}</b>`,
              `w = s⁻¹ mod 11 = <b>${v.w}</b>`,
              `u1 = z·w mod 11 = <b>${v.u1}</b>, u2 = r·w mod 11 = <b>${v.u2}</b>`,
              `v = (4<sup>${v.u1}</sup>·${y}<sup>${v.u2}</sup> mod 23) mod 11 = ${v.V} mod 11 = <b>${v.v}</b>`,
              `Compare: v = ${v.v}, r = ${sig.r}.`,
            ];
            $("[data-steps]", el).innerHTML = lines
              .map(
                (l, i) => `<li style="animation-delay:${i * 0.35}s">${l}</li>`,
              )
              .join("");
            const why = [
              on.msg &&
                "the message changed after signing, so z no longer matches",
              on.key && "this public key does not belong to the signer",
              on.sig && "the signature was altered",
            ].filter(Boolean);
            $("[data-verdict]", el).innerHTML =
              `<span class="stamp ${v.ok ? "ok" : "no"}" style="animation-delay:${lines.length * 0.35}s">${v.ok ? "VALID" : "REJECTED"}</span>` +
              `<p class="small" style="animation:fade .5s ${lines.length * 0.35 + 0.3}s both">${v.ok ? "Everything matches, so v equals r. Nobody needed the private key to see that." : "v is not equal to r because " + why.join(" and ") + "."}</p>`;
            el.querySelectorAll("[data-t]").forEach((b) =>
              b.setAttribute("aria-pressed", String(on[b.dataset.t])),
            );
            if (v.ok) sawOk = true;
            else sawNo = true;
            if (sawOk && sawNo) fin();
          };
          el.querySelectorAll("[data-t]").forEach(
            (b) =>
              (b.onclick = () => {
                on[b.dataset.t] = !on[b.dataset.t];
                render();
              }),
          );
          $("[data-reset]", el).onclick = () => {
            on.msg = on.key = on.sig = false;
            render();
          };
          render();
        },

        WhereUsed(el, fin, p) {

        LoginDemo(el, fin) {
          el.classList.add("try", "lab");
          let chal = null,
            last = null,
            prevZ = -1,
            busy = false,
            replayed = false,
            tries = 0,
            lucky = 0;
          el.innerHTML = `<span class="label">Try it · Log in with a signature</span>
            <div class="login-grid">
              <div class="peer"><b>shop.example</b><small>knows only y = ${TY}</small></div>
              <div class="lane"><span class="fly" data-fly></span></div>
              <div class="peer"><b>Meera’s phone</b><small>holds x, never sends it</small></div>
            </div>
            <div class="ctl"><button data-ask>1 · Ask to log in</button><button data-ok disabled>2 · Approve on the phone</button></div>
            <div class="ctl"><span class="small">Eve is listening on the wire:</span><button class="ghost" data-replay disabled>Replay Meera’s old signature</button><button class="ghost" data-guess disabled>Guess a signature</button></div>
            <ol class="feed" data-feed aria-live="polite"></ol>`;
          const ask = $("[data-ask]", el),
            ok = $("[data-ok]", el),
            replay = $("[data-replay]", el),
            guess = $("[data-guess]", el),
            feed = $("[data-feed]", el),
            fly = $("[data-fly]", el);
          const add = (cls, h) => {
            const li = document.createElement("li");
            li.className = cls;
            li.innerHTML = h;
            feed.appendChild(li);
          };
          const send = async (label, dir) => {
            fly.textContent = label;
            fly.className = "fly go-" + dir;
            await sleep(950);
            fly.className = "fly";
          };
          const freshZ = (...avoid) => {
            let z;
            do z = Math.floor(Math.random() * TQ);
            while (avoid.includes(z));
            prevZ = z;
            return z;
          };
          const verdict = (z, r, s) => {
            const v = toyVerify(z, r, s, TY);
            return { ok: v.ok, text: `v = ${v.v}, r = ${r}` };
          };
          ask.onclick = async () => {
            if (busy) return;
            busy = true;
            feed.innerHTML = "";
            chal = freshZ(prevZ);
            add(
              "",
              `<b>shop.example</b> sends a fresh random challenge: <b>z = ${chal}</b>.`,
            );
            await send("z = " + chal, "r");
            ok.disabled = false;
            busy = false;
          };
          ok.onclick = async () => {
            if (busy || chal === null) return;
            busy = true;
            ok.disabled = true;
            let sg, k;
            // r of 1 or 2 can collide in the tiny toy group, so skip those nonces.
            do {
              k = pick(10);
              sg = toySign(chal, TX, k);
            } while (!sg || sg.r < 3);
            add(
              "",
              `Meera’s phone signs z = ${chal} with a fresh nonce k = ${k}: <b>(r, s) = (${sg.r}, ${sg.s})</b>.`,
            );
            await send(`(${sg.r}, ${sg.s})`, "l");
            const v = verdict(chal, sg.r, sg.s);
            add(
              v.ok ? "ok" : "no",
              `shop.example checks with y = ${TY}: ${v.text}. <b>${v.ok ? "Welcome back, Meera." : "Rejected."}</b>`,
            );
            last = { z: chal, r: sg.r, s: sg.s };
            chal = null;
            replay.disabled = guess.disabled = false;
            busy = false;
          };
          replay.onclick = async () => {
            if (busy || !last) return;
            busy = true;
            ok.disabled = true;
            feed.innerHTML = "";
            chal = null;
            const z2 = freshZ(prevZ, last.z);
            add(
              "",
              `A new login starts. <b>shop.example</b> sends challenge <b>z = ${z2}</b>.`,
            );
            await send("z = " + z2, "r");
            add(
              "",
              `Eve answers with the old signature <b>(${last.r}, ${last.s})</b> that she copied from the wire.`,
            );
            await send(`(${last.r}, ${last.s})`, "l");
            const v = verdict(z2, last.r, last.s);
            add(
              v.ok ? "ok" : "no",
              `shop.example checks: ${v.text}. <b>${v.ok ? "Accepted." : "Rejected."}</b> A signature only fits the challenge it was made for, so a copy is useless.`,
            );
            replayed = true;
            if (replayed) fin();
            busy = false;
          };
          guess.onclick = async () => {
            if (busy || !last) return;
            busy = true;
            ok.disabled = true;
            feed.innerHTML = "";
            chal = null;
            const z2 = freshZ(prevZ),
              r = pick(10),
              s = pick(10);
            add(
              "",
              `A new login starts. <b>shop.example</b> sends challenge <b>z = ${z2}</b>.`,
            );
            await send("z = " + z2, "r");
            add(
              "",
              `Eve has no private key, so she guesses <b>(${r}, ${s})</b>.`,
            );
            await send(`(${r}, ${s})`, "l");
            const v = verdict(z2, r, s);
            tries++;
            if (v.ok) lucky++;
            add(
              v.ok ? "ok" : "no",
              v.ok
                ? `${v.text}. <b>Accepted: a lucky guess.</b> This toy group has only 100 possible signatures, so about 1 guess in 10 passes. In Bitcoin the odds are about 1 in 2<sup>256</sup>.`
                : `${v.text}. <b>Rejected.</b> (Guesses so far: ${tries}, accepted: ${lucky}.)`,
            );
            busy = false;
          };
        },

        NonceTrap(el, fin) {
          el.classList.add("try", "lab");
          const MA = "Pay Aarav 0.5 BTC",
            MB = "Pay Aarav 0.2 BTC",
            zA = toyHash(MA),
            zB = toyHash(MB);
          let reuse = true,
            step = 0;
          el.innerHTML = `<span class="label">Try it · Play Eve</span>
            <div class="ctl">
              <button class="ghost" aria-pressed="true" data-mode="reuse">Wallet reuses k (the bug)</button>
              <button class="ghost" aria-pressed="false" data-mode="fresh">Wallet uses a fresh k each time</button>
            </div>
            <div data-stage></div>
            <div class="ctl"><button data-next></button><button class="ghost" data-again>Start over</button></div>`;
          const stage = $("[data-stage]", el),
            nextBtn = $("[data-next]", el);
          const build = () => {
            const A = toySign(zA, TX, 3),
              B = toySign(zB, TX, reuse ? 3 : 7),
              hl = (v, on) => (on ? `<mark class="hl">${v}</mark>` : v),
              table = (on) =>
                `<table class="nt-table"><thead><tr><th></th><th>message</th><th>z</th><th>signature (r, s)</th></tr></thead><tbody>
                  <tr><td>Tx A</td><td>${MA}</td><td>${zA}</td><td>(${hl(A.r, on)}, ${A.s})</td></tr>
                  <tr><td>Tx B</td><td>${MB}</td><td>${zB}</td><td>(${hl(B.r, on)}, ${B.s})</td></tr></tbody></table>`;
            if (!reuse)
              return [
                `Two signatures from Meera’s wallet are public. Eve can read them, but she has no private key.${table(false)}`,
                `The r values are different (${A.r} and ${B.r}), so nothing links the two nonces. Eve has two equations but three unknowns: x, k<sub>1</sub> and k<sub>2</sub>. She cannot solve them.`,
                `Eve is stuck. A fresh nonce for every signature keeps x safe. Bitcoin Core derives k from the private key and the message (RFC 6979), so two different messages never share a nonce.`,
              ];
            const k = tmod(tmod(zA - zB) * tinv(tmod(A.s - B.s))),
              x = tmod(tmod(A.s * k - zA) * tinv(A.r));
            return [
              `Two signatures from Meera’s wallet are public. Eve can read them, but she has no private key.${table(false)}`,
              `Look at r: it is <mark class="hl">${A.r}</mark> in both. The same r means the wallet used the same nonce k twice.${table(true)}`,
              `Subtract the two signing equations. The secret x cancels: s<sub>1</sub> − s<sub>2</sub> = k⁻¹·(z<sub>1</sub> − z<sub>2</sub>), so<br>k = (z<sub>1</sub> − z<sub>2</sub>) / (s<sub>1</sub> − s<sub>2</sub>) = (${zA} − ${zB}) / (${A.s} − ${B.s}) = <b>${k}</b> (mod 11).`,
              `Rearrange s = k⁻¹·(z + x·r) for x:<br>x = (s·k − z) / r = (${A.s}·${k} − ${zA}) / ${A.r} = <b>${x}</b> (mod 11).`,
              `Check: 4<sup>${x}</sup> mod 23 = ${tpow(TG, x)}, which is Meera’s public key. Eve now holds the private key and can sign anything as Meera.<div class="nt-reveal"><span class="nt-key">private key x = ${x}</span></div>`,
            ];
          };
          const render = () => {
            const steps = build();
            stage.innerHTML =
              `<ol class="steplog">` +
              steps
                .slice(0, step + 1)
                .map((s) => `<li>${s}</li>`)
                .join("") +
              `</ol>`;
            const lastStep = step >= steps.length - 1;
            nextBtn.disabled = lastStep;
            nextBtn.textContent = lastStep ? "Done" : "Next step";
            el.querySelectorAll("[data-mode]").forEach((b) =>
              b.setAttribute(
                "aria-pressed",
                String((b.dataset.mode === "reuse") === reuse),
              ),
            );
            if (lastStep && reuse) fin();
          };
          nextBtn.onclick = () => {
            step++;
            render();
          };
          $("[data-again]", el).onclick = () => {
            step = 0;
            render();
          };
          el.querySelectorAll("[data-mode]").forEach(
            (b) =>
              (b.onclick = () => {
                reuse = b.dataset.mode === "reuse";
                step = 0;
                render();
              }),
          );
          render();
        },
      });

      const BLOCKS = {
        text: (b) => wrap(md(b.md)),
        aside: (b) => wrap(inline(b.md), "aside"),
        figure: (b) => {
          const el = document.createElement("figure");
          el.innerHTML =
            ASSETS[b.asset] + `<figcaption>${b.caption}</figcaption>`;
          return el;
        },
        widget: (b) => {
          const el = wrap("");
          WIDGETS[b.name](el, () => done(b.id), b.props || {});
          return el;
        },
        reflect: (b) => {
          const el = wrap(
            `<div class="try"><span class="label">Write your note</span><p>${b.prompt}</p><textarea placeholder="${b.placeholder}"></textarea><button data-go>Compare with an example</button><div class="out"></div></div>`,
          );
          $("[data-go]", el).onclick = () => {
            $(".out", el).innerHTML =
              `<p>${b.model}</p><p class="small">Use this as a comparison, not something you need to copy word for word.</p>`;
            done(b.id);
          };
          return el;
        },
        next: () => {
          const n = L.next;
          return wrap(
            `<div class="label">Next lesson</div><h3>${n.id} ${n.title}</h3><p>${n.teaser}</p>`,
            "next",
          );
        },
      };
      $("#head").innerHTML =
        `<div class="kicker">${L.phase} · ${L.module}</div><h1>${L.title}</h1><p class="sub">${L.subtitle}</p><div class="meta">Lesson ${L.id} · about ${L.minutes} minutes · ${L.level}</div>`;
      const main = $("#lesson");
      L.sections.forEach((s) => {
        const sec = document.createElement("section");
        sec.id = s.id;
        sec.innerHTML = `<div class="label">${s.label}</div><h2>${s.title}</h2>`;
        s.blocks.forEach((b) => {
          if (BLOCKS[b.type]) sec.appendChild(BLOCKS[b.type](b));
        });
        main.appendChild(sec);
      });
      prog();
    </script>
    <script type="module" src="../../navigation.js"></script>
  </body>
</html>
