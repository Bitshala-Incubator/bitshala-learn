              {
                "type": "text",
                "md": "Meera wants to test a fictional set of digital shop vouchers. She can record the vouchers in an asset protocol that uses Bitcoin transactions, but the vouchers are not bitcoins and Bitcoin's consensus rules do not define their terms. The protocol, the issuer's promises, the wallet software, and the Bitcoin transaction each have different jobs."
              },
              {

                "md": "This lesson is a conceptual introduction, not instructions for issuing or storing real assets. RGB and Taproot Assets use different formats and proof systems; their data is not interchangeable."

          {
            "id": "client-validation",
            "label": "1 · Client-side validation",
            "title": "The recipient checks the asset proof",
            "blocks": [
              {
                "type": "text",
                "md": "In client-side validation, the sender gives the recipient the asset data and the history needed to check a transfer. The recipient's compatible client validates that proof against the asset protocol's rules. Bitcoin still orders and validates Bitcoin transactions; a transaction can commit to asset data, but Bitcoin nodes do not inspect the full asset proof or decide whether an asset issuer kept a promise."
              },
              {
                "type": "figure",
                "asset": "validationFlow",
                "caption": "The recipient validates the asset data and history. Bitcoin's public ledger validates the Bitcoin transaction and anchors a commitment to the transfer."
              },
              {
                "type": "text",
                "md": "This division can keep detailed asset data off the public chain and reduce how much data every Bitcoin node must process. It also puts work on each recipient: obtain the right proof data, check its history with the correct software, and keep the data needed to validate or pass the asset on. A confirmed Bitcoin transaction alone is not proof that the voucher or other asset is valid."
              },
              {
                "type": "reflect",
                "prompt": "Explain the basic idea in your own words. What does the recipient's client validate, and what does Bitcoin validate?",

                "model": "The recipient's compatible client checks the asset transfer data and history against the asset protocol's rules. Bitcoin nodes validate Bitcoin transactions and consensus rules; they can confirm a transaction that anchors a commitment, but they do not validate the full asset proof or the issuer's promises."
              }

          },
          {
            "id": "rgb",
            "label": "2 · RGB",
            "title": "RGB keeps contract state with the participants",
            "blocks": [
              {
                "type": "text",
                "md": "RGB is a family of Bitcoin-based contract and asset protocols built around client-side validation. In a simplified transfer, the sender passes the recipient an RGB consignment: data that lets the recipient validate the contract state and the history leading to the new allocation. The relevant state data is exchanged between participants instead of publishing the complete asset history to every Bitcoin node."
              },
              {
                "type": "text",
                "md": "RGB uses single-use seals linked to Bitcoin transaction outputs. Spending the output closes the previous seal, while a commitment in a Bitcoin transaction anchors the next state. The Bitcoin transaction helps order the transition and prevent conflicting use of the same seal; the recipient still needs and checks the RGB data. [RGB's client-side validation guide](https://docs.rgb.info/distributed-computing-concepts/client-side-validation) and [commitment guide](https://docs.rgb.info/commitment-layer/commitment-schemes) describe these roles."
              },
              {
                "type": "aside",
                "md": "For Meera's voucher, the Bitcoin transaction can anchor the transfer, while the recipient's RGB client checks the voucher's protocol history. Seeing the transaction in a block does not replace that client-side check."
              }
            ]
          },

            "label": "3 · Taproot Assets",
            "title": "Taproot outputs anchor asset state and proofs",
            "blocks": [
              {
                "type": "text",
                "md": "Taproot Assets is a separate protocol that uses Taproot commitments in Bitcoin transactions. Its witness data carries asset transfer information to the recipient off-chain. The recipient checks the proof lineage back to the asset's genesis and checks the referenced Bitcoin outputs against the blockchain. A Bitcoin node validates the transaction and Taproot rules; it does not apply Taproot Assets' full asset logic."
              },
              {
                "type": "text",
                "md": "The official Taproot Assets materials describe issuing and transferring assets with Bitcoin UTXOs as anchors and keeping witness data off-chain. The protocol can support multiple asset records in one Bitcoin UTXO, while clients exchange the data needed to validate transfers. [The Taproot Assets project overview](https://github.com/lightninglabs/taproot-assets/blob/main/README.md) explains the transfer flow; [the protocol guide](https://docs.lightning.engineering/the-lightning-network/taproot-assets/taproot-assets-protocol) describes Taproot commitments and asset proofs."
              },
              {
                "type": "aside",
                "md": "An asset proof is protocol-specific. A Taproot Assets proof does not become an RGB proof just because both protocols use Bitcoin transactions. Use compatible software and keep the proof data needed by that wallet."
              }
            ]
