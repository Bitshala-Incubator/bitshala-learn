              {
                "type": "aside",
                "md": "“My node confirmed the payment,” Aarav says. “Does that mean it knows who I meant to pay?” Meera shakes her head. “It checks Bitcoin’s rules. You still have to check the destination.”"
              },
              {
                "type": "text",
                "md": "A receiving address is useful to share with a payer. A private key is different: it lets the wallet create signatures that authorize spends and must stay secret. A wallet manages keys and transactions; bitcoin is represented by spendable outputs recorded on the network, not stored inside the wallet. An account xpub cannot sign, but sharing it can reveal many addresses and payment activity. [Bitcoin's developer guide explains wallet roles](https://developer.bitcoin.org/devguide/wallets.html); [Trezor explains the privacy risk of an xpub](https://trezor.io/learn/supported-assets/bitcoin/what-is-a-public-key-xpub)."
