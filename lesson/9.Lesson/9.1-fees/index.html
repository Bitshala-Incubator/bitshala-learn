        "title": "Fees",
        "subtitle": "Why a transaction pays a fee, how a fee rate is measured in vbytes, and how a wallet chooses one.",

          {

            "label": "The question",
            "title": "Which speed should Aarav pick?",
            "blocks": [
              {
                "type": "text",
                "md": "Aarav opens his wallet to pay Meera. The send screen shows three choices: **Fast**, **Normal**, and **Slow**. Each one changes a number called the fee, and he is not sure what he is paying for."
              },
              {
                "type": "text",
                "md": "Meera laughs. “You are paying for space. A block has room for about 4 million weight units, and miners fill it with the transactions that pay the most per unit of space.”"
              },
              {
                "type": "text",
                "md": "We will work through four steps: what the fee is, how a fee rate is measured, how a wallet picks one, and what to do when the network is busy."
              }
            ]
          },
          {
            "id": "part1",

            "title": "The fee is what is left over",
            "blocks": [
              {
                "type": "text",
                "md": "A transaction does not say “fee: 1,500 sat”. It only lists **inputs** (coins being spent) and **outputs** (new coins created). The fee is the difference:"
              },
              {
                "type": "aside",
                "md": "**Fee = total inputs − total outputs**"
              },
              {
                "type": "figure",
                "asset": "fee",
                "caption": "The miner receives whatever the inputs do not pay out."
              },

                "type": "widget",

            "id": "real",
            "label": "Real life",
            "title": "Who gets the fee, and what overpaying buys",
            "blocks": [
              {
                "type": "text",
                "md": "Bitcoin has no price list. Senders bid with fees, and miners fill each block with the highest bids first. Background: [Blockstream: why Bitcoin has fees](https://help.blockstream.com/education/transactions/transaction-basics/why-does-bitcoin-have-fees) and [Bitcoin wiki: Miner fees](https://en.bitcoin.it/wiki/Miner_fees)."
              },
              {
                "type": "aside",
                "md": "**Who gets the money?** The miner who finds the block collects every fee in it. Block 840,000 is a real example: its fees were about 92% of the reward, see the Explore section above."
              },
              {
                "type": "text",
                "md": "**Who benefits?** Miners earn the fees. Senders in a hurry pay more to get in. Wallets and sites such as [mempool.space](https://mempool.space) help users read the queue, but they cannot promise a confirmation time."
              },
              {
                "type": "text",
                "md": "**What if you pay above the price?** The next block still arrives whenever it arrives, so an extra fee does not bring it sooner. The extra simply goes to the miner. mempool.space says its own fee suggestions [are estimates and do not guarantee a time](https://api.mempool.space/docs/api)."
              },
              {
                "type": "text",
                "md": "**What if you pay too little?** Your transaction waits in each node’s mempool. If the queue stays full, nodes can drop it, and you may need to raise the fee or resend it."
              }
            ]
