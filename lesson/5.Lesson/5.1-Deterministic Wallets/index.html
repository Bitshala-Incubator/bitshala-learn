                "type": "text",
                "md": "Aarav sets up his wallet on a new computer. He enters his recovery material and watches hundreds of addresses reappear — the same ones he had before.\n\nHe turns to Meera. “If my wallet has hundreds of addresses, where are all those keys actually stored? Is it creating them randomly every time I open it?”\n\nMeera doesn’t answer directly. “Don’t take my word for it. Let’s use the same derivation rules real wallets use, run them ourselves, and inspect the output.”"

              {
                "type": "text",
                "md": "A deterministic wallet isn’t improvising. It starts from a **seed** and applies a repeatable algorithm. Feed the same seed through the same rules twice, and you get the same keys in the same order.\n\nThe seed itself isn’t a private key. BIP32 processes it into a **master extended key**, which contains a master private key and a **chain code**. The chain code is additional data used when deriving descendants. From there, child keys branch off along specific derivation paths."

              {
                "type": "figure",
                "asset": "hierarchy",

            "title": "Find the rule before you trust the output",
            "blocks": [

                "type": "text",
                "md": "Before running anything, find where this behaviour is specified: the <a href=\"https://github.com/bitcoin/bips/blob/master/bip-0032.mediawiki\" target=\"_blank\" rel=\"noopener\">BIP32 specification</a>. Near the end, it publishes test vectors: known seeds paired with the exact extended keys they must produce. A correct implementation should match them."

                "type": "text",
                "md": "Test vector 1 uses this public test seed: `000102030405060708090a0b0c0d0e0f`"

                "type": "text",
                "md": "With that double-checked, zoom out. Aarav keeps seeing BIP32, BIP39, and BIP44 in wallet recovery instructions, as if they were interchangeable. They're related, but each answers a different question. <a href=\"https://github.com/bitcoin/bips/blob/master/bip-0039.mediawiki\" target=\"_blank\" rel=\"noopener\">BIP39</a> defines how a mnemonic phrase and optional passphrase become seed bytes. <a href=\"https://github.com/bitcoin/bips/blob/master/bip-0032.mediawiki\" target=\"_blank\" rel=\"noopener\">BIP32</a> defines the master key and child-key derivation — everything you just ran. <a href=\"https://github.com/bitcoin/bips/blob/master/bip-0044.mediawiki\" target=\"_blank\" rel=\"noopener\">BIP44</a> defines a convention for organising keys by purpose, coin type, account, change branch, and address index — a path convention, not a replacement for BIP32."

            if (stage === 1)
              h += `<p>The master key is in <code>master</code>. Type the command to derive the hardened child at <code>m/0'</code>.</p><div class="labinput"><input id="cmd" placeholder="master.derive(&quot;...&quot;)" aria-label="Command to derive the hardened child" autocomplete="off" spellcheck="false"><button data-run>Run</button></div><div class="msg" id="cmdmsg"></div>`;
            if (stage === 2)
              h += `<p>Now derive a child along a path of your own choosing, anything valid, such as <code>m/1'</code>, <code>m/0/1</code>, or <code>m/44'/0'/0'</code>. Type the full command using <code>master</code>.</p><div class="labinput"><input id="cmd" placeholder="master.derive(&quot;...&quot;)" aria-label="Command to derive your chosen path" autocomplete="off" spellcheck="false"><button data-run>Run</button></div><div class="msg" id="cmdmsg"></div>`;
            if (stage === 3)
              h += `<p>Type that exact same command again — same path, run a second time.</p><div class="labinput"><input id="cmd" placeholder='master.derive("${escapeHTML(chosenPath)}")' aria-label="Repeat the same command" autocomplete="off" spellcheck="false"><button data-run>Run</button></div><div class="msg" id="cmdmsg"></div>`;
            if (stage === 4)
              h += `<p>Compare the full extended public keys for your chosen path and the repeated path.</p><div class="termbox">${terminalLine("first.publicExtendedKey", baseChild.publicExtendedKey)}${terminalLine("second.publicExtendedKey", master.derive(chosenPath).publicExtendedKey)}</div><p class="msg">Same seed + same path = same derived key, typed and run twice. This comparison was computed by BIP32.</p>`;
            el.innerHTML = h;
            if (stage < 4) {
              const go = () => {
                const cmd = $("#cmd", el).value.trim();
                const m = $("#cmdmsg", el);
                if (!cmd) {
                  m.textContent = "Type a command first.";
                  return;
                }
                if (stage === 0) {
                  let r;
                  try {
                    r = runCmd(cmd);
                  } catch (e) {
                    m.textContent = "That line threw an error: " + e.message;
                    return;
                  }
                  if (!looksLikeNode(r)) {
                    m.textContent =
                      "That didn't produce a master key. Try: HDKey.fromMasterSeed(seed)";
                    return;
                  }
                  master = r;
                  logs.push({
                    cmd,
                    out: `Master public key: ${bytesToHex(r.publicKey)}\nChain code: ${bytesToHex(r.chainCode)}\nMaster xpub: ${r.publicExtendedKey}`,
                  });
                  stage = 1;
                  draw();
                  return;
                }
                const pm = pathRe.exec(cmd);
                if (!/master\s*\.\s*derive\s*\(/.test(cmd) || !pm) {
                  m.textContent =
                    'Type a command that calls master.derive("...") with a path in quotes.';
                  return;
                }
                const path = pm[2];
                if (stage === 1 && path !== "m/0'") {
                  m.textContent =
                    "This step specifically wants m/0'. Try: master.derive(\"m/0'\")";
                  return;
                }
                if (stage === 2 && (!validPath(path) || path === "m")) {
                  m.textContent =
                    "Enter a valid child path such as m/1 or m/1 prime. Indices must be below 2³¹.";
                  return;
                }
                if (stage === 3 && path !== chosenPath) {
                  m.textContent = `Type the exact same path as before: ${chosenPath}`;
                  return;
                }
                let r;
                try {
                  r = runCmd(cmd);
                } catch (e) {
                  m.textContent = "Derivation failed: " + e.message;
                  return;
                }
                logs.push({
                  cmd,
                  out: `Public key: ${bytesToHex(r.publicKey)}\nChain code: ${bytesToHex(r.chainCode)}\nExtended public key: ${r.publicExtendedKey}`,
                });
                if (stage === 1) {
                  stage = 2;
                  draw();
                  return;
                }
                if (stage === 2) {
                  baseChild = r;
                  chosenPath = path;
                  stage = 3;
                  draw();
                  return;
                }
                if (stage === 3) {
                  const same =
                    bytesToHex(baseChild.publicKey) ===
                      bytesToHex(r.publicKey) &&
                    baseChild.publicExtendedKey === r.publicExtendedKey;
                  if (same) {
                    stage = 4;
                    draw();
                    fin();
                  } else {
                    m.textContent = "Mismatch — investigate before continuing.";
                  }
                }
              };
              $("[data-run]", el).onclick = go;
              $("#cmd", el).onkeydown = (e) => {
                if (e.key === "Enter") {
                  e.preventDefault();
                  go();
                }
              };
            }
          };
          draw();
        },
        WatchOnly(el, fin) {
          el.classList.add("try");
          let stage = 0;
          const r = root(),
            watch = HDKey.fromExtendedKey(r.publicExtendedKey);
          const draw = () => {
            let h = '<span class="label">Watch-only experiment</span>';
            if (stage === 0)
              h += `<p>Start from the master xpub. This object contains no private key.</p><div class="termbox">${terminalLine("watch = HDKey.fromExtendedKey(master.publicExtendedKey)", `Private key present: ${watch.privateKey !== null}\nMaster xpub: ${watch.publicExtendedKey}`)}</div><button data-start>Try non-hardened derivation</button>`;
            if (stage === 1)
              h += `<p>Choose a path containing only non-hardened indices. Every component must be non-hardened because this xpub is at the master node.</p><div class="labinput"><input id="wpath" placeholder="e.g. m/0" aria-label="Non-hardened path"><button data-nh>Derive from xpub</button></div><div class="msg" id="wmsg"></div>`;
            if (stage === 2)
              h += `<p>Now test a hardened path from the same xpub, such as <code>m/0'</code>.</p><div class="labinput"><input id="hpath" placeholder="e.g. m/0'" aria-label="Hardened path"><button data-h>Try hardened derivation</button></div><div class="msg" id="hmsg"></div>`;
            if (stage === 3)
              h += `<p>Why did the hardened derivation fail?</p><button class="ghost" data-finish>Show explanation</button><div class="msg" id="finalmsg"></div>`;
            el.innerHTML = h;
            if (stage === 0)
              $("[data-start]", el).onclick = () => {
                stage = 1;
                draw();
              };
            if (stage === 1)
              $("[data-nh]", el).onclick = () => {
                const v = $("#wpath", el).value.trim(),
                  m = $("#wmsg", el);
                if (!validPath(v) || v === "m" || hasHardened(v)) {
                  m.textContent =
                    "Use a child path with no hardened components, for example m/0 or m/0/1.";
                  return;
                }
                try {
                  const pub = watch.derive(v),
                    priv = r.derive(v);
                  const same =
                    bytesToHex(pub.publicKey) === bytesToHex(priv.publicKey);
                  m.innerHTML = `${same ? "Match verified" : "Mismatch"}: public key from xpub = <code>${bytesToHex(pub.publicKey)}</code><br>Public key from private hierarchy = <code>${bytesToHex(priv.publicKey)}</code><br>Private key present in watch-only object: <b>${pub.privateKey !== null}</b>`;
                  if (same) {
                    stage = 2;
                    setTimeout(draw, 900);
                  }
                } catch (e) {
                  m.textContent = "Derivation failed: " + e.message;
                }
              };
            if (stage === 2)
              $("[data-h]", el).onclick = () => {
                const v = $("#hpath", el).value.trim(),
                  m = $("#hmsg", el);
                if (!validPath(v) || v === "m" || !hasHardened(v)) {
                  m.textContent =
                    "Enter a valid hardened child path such as m/0'.";
                  return;
                }
                try {
                  watch.derive(v);
                  m.textContent =
                    "Unexpected success. Do not proceed; investigate the implementation.";
                } catch (e) {
                  m.textContent =
                    "Expected failure: an xpub cannot derive hardened descendants. " +
                    e.message;
                  stage = 3;
                  setTimeout(draw, 900);
                }
              };
            if (stage === 3)
              $("[data-finish]", el).onclick = () => {
                $("#finalmsg", el).textContent =
                  "Hardened derivation uses the parent private key in its derivation input. The xpub only has public key data and a chain code, so it cannot compute that child. It also cannot sign transactions. Mission 4 of 5 done — one more mission, then the report.";
                fin();
              };
          };
          draw();
        },
        ExternalVerify(el, fin) {
          el.classList.add("try");
          let copied = false;
          const draw = () => {
            el.innerHTML = `<span class="label">Cross-check against an independent tool</span>
   <p>1. Open <a href="https://iancoleman.io/bip39/" target="_blank" rel="noopener">iancoleman.io/bip39</a> in a new tab.</p>
   <p>2. Copy the test seed below, scroll down on that page to the <b>BIP39 Seed</b> field, and paste it in there — overwriting whatever is already in it. This field recomputes the <b>BIP32 Root Key</b> the moment you paste.</p>
   <div class="labinput"><input id="seedcopy" readonly value="${TEST_SEED}" aria-label="Test seed to copy"><button data-copy>${copied ? "Copied" : "Copy seed"}</button></div>
   <p>3. Copy the <b>BIP32 Root Key</b> that site now shows, and paste it below.</p>
   <div class="labinput"><input id="extresult" placeholder="Paste the BIP32 Root Key from iancoleman.io" aria-label="BIP32 root key from the external tool"><button data-check>Compare</button></div>
   <div class="msg" data-result></div>
   <p class="small">This is the same published test seed from Mission 1 — public test data, safe to paste anywhere for this exercise. Never paste a real mnemonic or seed into any website, this one included. For real funds, run a tool like this from a downloaded copy, offline.</p>`;
            $("[data-copy]", el).onclick = async () => {
              try {
                await navigator.clipboard.writeText(TEST_SEED);
                copied = true;
              } catch {
                $("#seedcopy", el).select();
              }
              draw();
            };
            $("[data-check]", el).onclick = () => {
              const v = $("#extresult", el).value.trim();
              const x = $("[data-result]", el);
              if (!v) {
                x.textContent =
                  "Paste the root key the other tool computed, then compare.";
                return;
              }
              if (v === EXPECTED_XPRV) {
                x.textContent =
                  "Match: iancoleman.io's independently-written implementation computed the exact same master extended key as the library running in this page. Two separate codebases, same seed, same result. Mission 5 of 5 done — that's all five. Scroll down to write up what you found.";
                fin();
              } else
                x.textContent =
                  "That doesn't match what this page computed. Double-check you pasted the seed into the BIP39 Seed field (not the mnemonic box), and that you copied the whole BIP32 Root Key.";
            };
          };
          draw();
        },
      };
      const BLOCKS = {
        text: (b) => wrap(md(b.md)),
        aside: (b) => wrap(inline(b.md), "aside"),
        figure: (b) => {
          const el = document.createElement("figure");
          el.innerHTML =
            ASSETS[b.asset] + `<figcaption>${b.caption}</figcaption>`;
          return el;
        },
        table: (b) => {
          const el = document.createElement("div");
          el.className = "blk";
          el.innerHTML = `<table class="vtable"><thead><tr>${b.headers.map((x) => `<th>${x}</th>`).join("")}</tr></thead><tbody>${b.rows.map((r) => `<tr>${r.map((c) => `<td>${c}</td>`).join("")}</tr>`).join("")}</tbody></table>`;
          return el;
        },
        widget: (b) => {
          const el = wrap("");
          WIDGETS[b.name](el, () => done(b.id));
          return el;
        },
        reflect: (b) => {
          const el = wrap(
            `<div class="try"><span class="label">Write your report</span><p>${b.prompt}</p><textarea placeholder="${b.placeholder}"></textarea><button data-go>Compare with an example</button><div class="out"></div></div>`,
          );
          $("[data-go]", el).onclick = () => {
            $(".out", el).innerHTML =
              `<p>${b.model}</p><p class="small">Use this as a comparison, not something you need to copy word for word.</p>`;
            done(b.id);
          };
          return el;
        },
        next: () => {
          const n = L.next;
          return wrap(
            `<div class="label">Next lesson</div><h3>${n.id} ${n.title}</h3><p>${n.teaser}</p>`,
            "next",
          );
        },
      };
      $("#head").innerHTML =
        `<div class="kicker">${L.phase} · ${L.module}</div><h1>${L.title}</h1><p class="sub">${L.subtitle}</p><div class="meta">Lesson ${L.id} · about ${L.minutes} minutes · ${L.level}</div>`;
      const main = $("#lesson");
      L.sections.forEach((s) => {
        const sec = document.createElement("section");
        sec.id = s.id;
        sec.innerHTML = `<div class="label">${s.label}</div><h2>${s.title}</h2>`;
        s.blocks.forEach((b) => {
          if (BLOCKS[b.type]) sec.appendChild(BLOCKS[b.type](b));
        });
        main.appendChild(sec);
      });
      prog();
    </script>
  </body>
</html>
