              {
                "type": "text",
                "md": "A BIP39 mnemonic isn’t some arbitrary password. Every word comes from a fixed, published list of 2048 words, and each one is a label for a number. Behind the scenes, the wallet generates random **entropy** (128 to 256 bits, in steps of 32), appends a short **checksum** of that entropy, then splits the result into 11-bit chunks. Each chunk is a number from 0 to 2047, which selects a word from the list. Twelve words encode 128 bits of entropy plus a 4-bit checksum. The words give a human a way to write down and re-enter the entropy; the checksum catches many transcription errors, but not all of them. They are not the seed, and they are not a password."

                "asset": "wordindex",
                "caption": "A word isn’t secret or clever on its own. It’s just a friendly label for an 11-bit number."
              },

                "type": "text",
                "md": "You can also add an optional **passphrase** on top, sometimes called a ‘25th word.’ The mnemonic and passphrase are combined with PBKDF2-HMAC-SHA512, run for 2048 rounds, to produce a 64-byte **seed**. That seed is exactly what Lesson 5.1’s `HDKey.fromMasterSeed` expects. The passphrase is case-sensitive: even a different or missing passphrase produces a different, valid seed, with no warning that it is the wrong one. To recover the same wallet, you need the same mnemonic, passphrase, and derivation path."
              },

                "type": "figure",
                "asset": "seedflow",
                "caption": "Entropy and a checksum become words. The words and optional passphrase become the seed BIP32 already knows how to use."

        SeedConsole(el, fin) {
          el.classList.add("try");
          let stage = 0,
            seed = null,
            master = null;
          const runCmd = (cmd) =>
            new Function(
              "bip39",
              "wordlist",
              "mnemonic",
              "passphrase",
              "HDKey",
              "seed",
              "master",
              `return (${cmd})`,
            )(
              bip39,
              wordlist,
              TEST_MNEMONIC,
              TEST_PASSPHRASE,
              HDKey,
              seed,
              master,
            );
          const draw = () => {
            let h =
              '<span class="label">Live BIP39 console</span><p class="small">A real console. <code>mnemonic</code> and <code>passphrase</code> already hold the published test values. Type the line yourself and press Run.</p>';
            if (stage > 0)
              h += `<div class="termbox">${stage >= 1 ? terminalLine("bip39.mnemonicToSeedSync(mnemonic, passphrase)", bytesToHex(seed)) : ""}${stage >= 2 ? terminalLine("HDKey.fromMasterSeed(seed).privateExtendedKey", master.privateExtendedKey) : ""}</div>`;
            if (stage === 0)
              h += `<p>1. Turn <code>mnemonic</code> and <code>passphrase</code> into a 64-byte seed. Check the @scure/bip39 docs for the function name.</p><div class="labinput"><input id="cmd" placeholder="Type your expression here" aria-label="Command to derive the seed" autocomplete="off" spellcheck="false"><button data-run>Run</button></div><div class="msg" id="cmdmsg"></div>`;
            if (stage === 1)
              h += `<p>2. <code>seed</code> is set. Feed it into the exact same function you used last lesson.</p><div class="labinput"><input id="cmd" placeholder="Type your expression here" aria-label="Command to derive the master key" autocomplete="off" spellcheck="false"><button data-run>Run</button></div><div class="msg" id="cmdmsg"></div>`;
            if (stage === 2)
              h += `<p class="msg">Both values match the published reference vector for these exact words. The seed step is new; everything after it is the BIP32 machinery from last lesson, unchanged. Mission 2 of 4 done. Next, the gap problem.</p>`;
            el.innerHTML = h;
            if (stage < 2) {
              const go = () => {
                const cmd = $("#cmd", el).value.trim();
                const m = $("#cmdmsg", el);
                if (!cmd) {
                  m.textContent = "Type a command first.";
                  return;
                }
                let r;
                try {
                  r = runCmd(cmd);
                } catch (e) {
                  m.textContent = "That line threw an error: " + e.message;
                  return;
                }
                if (stage === 0) {
                  if (
                    !(r instanceof Uint8Array) ||
                    bytesToHex(r) !== EXPECTED_SEED_HEX
                  ) {
                    m.textContent =
                      "That should produce the published 64-byte seed. Try: bip39.mnemonicToSeedSync(mnemonic, passphrase)";
                    return;
                  }
                  seed = r;
                  stage = 1;
                  draw();
                  return;
                }
                if (stage === 1) {
                  if (!r || r.privateExtendedKey !== EXPECTED_XPRV) {
                    m.textContent =
                      "That should produce the published master key. Try: HDKey.fromMasterSeed(seed)";
                    return;
                  }
                  master = r;
                  stage = 2;
                  draw();
                  fin();
                  return;
                }
              };
              $("[data-run]", el).onclick = go;
              $("#cmd", el).onkeydown = (e) => {
                if (e.key === "Enter") {
                  e.preventDefault();
                  go();
                }
              };
            }
          };
          draw();
        },
        GapHunt(el, fin) {
          el.classList.add("try");
          let stage = 0,
            seen = [];
          const seed = bip39.mnemonicToSeedSync(TEST_MNEMONIC, TEST_PASSPHRASE);
          const master = HDKey.fromMasterSeed(seed);
          const pathRe = /derive\(\s*(["'`])((?:(?!\1).)*)\1\s*\)/;
          const draw = () => {
            let h =
              '<span class="label">Derive past where a wallet might stop looking</span>';
            if (seen.length)
              h += `<div class="termbox">${seen.map((x) => terminalLine(x.cmd, x.out)).join("")}</div>`;
            if (stage === 0)
              h += `<p>1. Derive the first receiving address key: <code>m/44'/0'/0'/0/0</code>.</p><div class="labinput"><input id="cmd" placeholder="master.derive(&quot;...&quot;)" aria-label="Derive index 0" autocomplete="off" spellcheck="false"><button data-run>Run</button></div><div class="msg" id="cmdmsg"></div>`;
            if (stage === 1)
              h += `<p>2. Now derive index 1 the same way: <code>m/44'/0'/0'/0/1</code>. It should be a completely different key.</p><div class="labinput"><input id="cmd" placeholder="master.derive(&quot;...&quot;)" aria-label="Derive index 1" autocomplete="off" spellcheck="false"><button data-run>Run</button></div><div class="msg" id="cmdmsg"></div>`;
            if (stage === 2)
              h += `<p>3. A recovery scan may stop after a run of unused addresses, but BIP32 can still derive keys beyond it. Pick any address index that's <b>20 or higher</b> and derive its key.</p><div class="labinput"><input id="cmd" placeholder="master.derive(&quot;...&quot;)" aria-label="Derive a high index" autocomplete="off" spellcheck="false"><button data-run>Run</button></div><div class="msg" id="cmdmsg"></div>`;
            if (stage === 3)
              h += `<p class="msg">That key derived exactly as cleanly as index 0 or 1. BIP32 doesn't know or care how far down the branch you go; deriving a key and scanning for its activity are different operations. Mission 3 of 4 done. One more mission, then the report.</p>`;
            el.innerHTML = h;
            if (stage < 3) {
              const go = () => {
                const cmd = $("#cmd", el).value.trim();
                const m = $("#cmdmsg", el);
                if (!cmd) {
                  m.textContent = "Type a command first.";
                  return;
                }
                const pm = pathRe.exec(cmd);
                if (!/master\s*\.\s*derive\s*\(/.test(cmd) || !pm) {
                  m.textContent =
                    'Call master.derive("...") with a path in quotes.';
                  return;
                }
                const path = pm[2];
                if (!validPath(path) || path === "m") {
                  m.textContent = "That path is not valid BIP32 syntax.";
                  return;
                }
                const idxMatch = /\/(\d+)$/.exec(path);
                const idx = idxMatch ? Number(idxMatch[1]) : null;
                if (stage === 0 && path !== "m/44'/0'/0'/0/0") {
                  m.textContent =
                    "This step specifically wants index 0: master.derive(\"m/44'/0'/0'/0/0\")";
                  return;
                }
                if (stage === 1 && path !== "m/44'/0'/0'/0/1") {
                  m.textContent =
                    "This step specifically wants index 1: master.derive(\"m/44'/0'/0'/0/1\")";
                  return;
                }
                if (stage === 2 && !(idx !== null && idx >= 20)) {
                  m.textContent =
                    "Pick an index of 20 or higher for this step.";
                  return;
                }
                let r;
                try {
                  r = new Function("master", `return (${cmd})`)(master);
                } catch (e) {
                  m.textContent = "Derivation failed: " + e.message;
                  return;
                }
                seen.push({
                  cmd,
                  out: `Public key: ${bytesToHex(r.publicKey)}`,
                });
                stage++;
                draw();
                if (stage === 3) fin();
              };
              $("[data-run]", el).onclick = go;
              $("#cmd", el).onkeydown = (e) => {
                if (e.key === "Enter") {
                  e.preventDefault();
                  go();
                }
              };
            }
          };
          draw();
        },
        PathTrap(el, fin) {
          el.classList.add("try");
          let stage = 0;
          const logs = [];
          let firstHex = "";
          const seed = bip39.mnemonicToSeedSync(TEST_MNEMONIC, TEST_PASSPHRASE);
          const master = HDKey.fromMasterSeed(seed);
          const pathRe = /derive\(\s*(["'`])((?:(?!\1).)*)\1\s*\)/;
          const draw = () => {
            let h =
              '<span class="label">Same seed, different path</span><p class="small">A real console. <code>master</code> already holds the same master key from this lesson\'s seed. Derive two different paths from it and compare the public keys they produce.</p>';
            if (logs.length)
              h += `<div class="termbox">${logs.map((x) => terminalLine(x.cmd, x.out)).join("")}</div>`;
            if (stage === 0)
              h += `<p>1. Derive the key at <code>m/44'/0'/0'/0/0</code> and read its public key.</p><div class="labinput"><input id="cmd" placeholder="master.derive(&quot;...&quot;).publicKey" aria-label="Command to derive the first path" autocomplete="off" spellcheck="false"><button data-run>Run</button></div><div class="msg" id="cmdmsg"></div>`;
            if (stage === 1)
              h += `<p>2. Now derive a completely different path, <code>m/0'/0'/0'</code>, from that exact same master key.</p><div class="labinput"><input id="cmd" placeholder="master.derive(&quot;...&quot;).publicKey" aria-label="Command to derive the second path" autocomplete="off" spellcheck="false"><button data-run>Run</button></div><div class="msg" id="cmdmsg"></div>`;
            if (stage === 2)
              h += `<p class="msg">Same seed, same master key, two completely unrelated public keys. Nothing is broken if a wallet shows empty after a correct restore. It might just be reading a different, equally valid branch of the same tree. Mission 4 of 4 done. That's everything this lesson has for you to run yourself. On to the report.</p>`;
            el.innerHTML = h;
            if (stage < 2) {
              const go = () => {
                const cmd = $("#cmd", el).value.trim();
                const m = $("#cmdmsg", el);
                if (!cmd) {
                  m.textContent = "Type a command first.";
                  return;
                }
                if (!/master\s*\.\s*derive\s*\(/.test(cmd)) {
                  m.textContent =
                    'Call master.derive("...") with a path in quotes.';
                  return;
                }
                if (!/\.publicKey\s*$/.test(cmd)) {
                  m.textContent =
                    "Read .publicKey at the end of the expression.";
                  return;
                }
                const pm = pathRe.exec(cmd);
                if (!pm) {
                  m.textContent = "Put the path in quotes inside derive(...).";
                  return;
                }
                const path = pm[2];
                if (stage === 0 && path !== "m/44'/0'/0'/0/0") {
                  m.textContent =
                    "This step specifically wants master.derive(\"m/44'/0'/0'/0/0\").publicKey";
                  return;
                }
                if (stage === 1 && path !== "m/0'/0'/0'") {
                  m.textContent =
                    "This step specifically wants master.derive(\"m/0'/0'/0'\").publicKey";
                  return;
                }
                let r;
                try {
                  r = new Function("master", `return (${cmd})`)(master);
                } catch (e) {
                  m.textContent = "That line threw an error: " + e.message;
                  return;
                }
                if (!(r instanceof Uint8Array)) {
                  m.textContent =
                    "That should return a public key as bytes. Make sure the expression ends in .publicKey";
                  return;
                }
                const hex = bytesToHex(r);
                if (stage === 0) {
                  firstHex = hex;
                  logs.push({ cmd, out: hex });
                  stage = 1;
                  draw();
                  return;
                }
                if (stage === 1) {
                  if (hex === firstHex) {
                    m.textContent =
                      "That matched the first path exactly, which should never happen for two different paths. Check what you typed.";
                    return;
                  }
                  logs.push({
                    cmd,
                    out: hex + "  (nothing like the first key)",
                  });
                  stage = 2;
                  draw();
                  fin();
                  return;
                }
              };
              $("[data-run]", el).onclick = go;
              $("#cmd", el).onkeydown = (e) => {
                if (e.key === "Enter") {
                  e.preventDefault();
                  go();
                }
              };
            }
          };
          draw();
        },
      };
      const BLOCKS = {
        text: (b) => wrap(md(b.md)),
        aside: (b) => wrap(inline(b.md), "aside"),
        figure: (b) => {
          const el = document.createElement("figure");
          el.innerHTML =
            ASSETS[b.asset] + `<figcaption>${b.caption}</figcaption>`;
          return el;
        },
        table: (b) => {
          const el = document.createElement("div");
          el.className = "blk";
          el.innerHTML = `<table class="vtable"><thead><tr>${b.headers.map((x) => `<th>${x}</th>`).join("")}</tr></thead><tbody>${b.rows.map((r) => `<tr>${r.map((c) => `<td>${c}</td>`).join("")}</tr>`).join("")}</tbody></table>`;
          return el;
        },
        widget: (b) => {
          const el = wrap("");
          WIDGETS[b.name](el, () => done(b.id));
          return el;
        },
        reflect: (b) => {
          const el = wrap(
            `<div class="try"><span class="label">Write your report</span><p>${b.prompt}</p><textarea placeholder="${b.placeholder}"></textarea><button data-go>Compare with an example</button><div class="out"></div></div>`,
          );
          $("[data-go]", el).onclick = () => {
            $(".out", el).innerHTML =
              `<p>${b.model}</p><p class="small">Use this as a comparison, not something you need to copy word for word.</p>`;
            done(b.id);
          };
          return el;
        },
        next: () => {
          const n = L.next;
          return wrap(
            `<div class="label">Next lesson</div><h3>${n.id} ${n.title}</h3><p>${n.teaser}</p>`,
            "next",
          );
        },
      };
      $("#head").innerHTML =
        `<div class="kicker">${L.phase} · ${L.module}</div><h1>${L.title}</h1><p class="sub">${L.subtitle}</p><div class="meta">Lesson ${L.id} · about ${L.minutes} minutes · ${L.level}</div>`;
      const main = $("#lesson");
      L.sections.forEach((s) => {
        const sec = document.createElement("section");
        sec.id = s.id;
        sec.innerHTML = `<div class="label">${s.label}</div><h2>${s.title}</h2>`;
        s.blocks.forEach((b) => {
          if (BLOCKS[b.type]) sec.appendChild(BLOCKS[b.type](b));
        });
        main.appendChild(sec);
      });
      prog();
    </script>
    <script type="module" src="../../navigation.js"></script>
  </body>
</html>
