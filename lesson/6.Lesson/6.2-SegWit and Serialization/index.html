hor="middle" stroke="none" font-size="14" font-weight="600">= 2</text></svg>`,

      }
      async function runAsync(cmd, scope) {
        const keys = Object.keys(scope),
          vals = Object.values(scope);
        const fn = new Function(
          ...keys,
          `return (async()=>{ return (${cmd}); })();`,
        );
        return await fn(...vals);
      }
      function runUserFn(code, fnName, args) {
        if (!new RegExp("function\\s+" + fnName + "\\s*\\(").test(code))
          throw new Error("Define a function named " + fnName + "(...).");
        const factory = new Function(code + `\nreturn ${fnName};`);

          hex.slice(10, 12).toLowerCase() === "01"

      function refReadVersion(hex) {
        const b = hex.slice(0, 8).match(/../g).reverse().join("");
        return parseInt(b, 16);
      }
      function refToVsize(weight) {
        return Math.ceil(weight / 4);
      }
      function refClassifyLocktime(lt) {
        if (lt === 0) return "none";
        if (lt < 500000000) return "height";
        return "time";
      }

            loadErr = null;
            let r, hex;
            try {
              r = await fetch(EXPLORER + "/tx/" + TXID).then((x) => x.json());
              hex = await fetch(EXPLORER + "/tx/" + TXID + "/hex").then((x) =>

              cmd: `fetch(EXPLORER + '/tx/' + TXID + '/hex')`,

            loading = false;
            stage = 1;

                  r = runUserFn(code, "classifyLocktime", [txJson.locktime]);
                } catch (e) {
                  m.textContent = "Error: " + e.message;
                  return;
                }
                const ref = refClassifyLocktime(txJson.locktime);
                if (r !== ref) {
                  m.textContent = `Got "${r}", that is not right for locktime ${txJson.locktime}. Check the 0 case and the 500,000,000 threshold.`;
                  return;
                }
                const human =
                  ref === "none"
                    ? "no restriction at all"
                    : ref === "height"
                      ? `must not confirm before block ${txJson.locktime}`
                      : `must not confirm before ${new Date(txJson.locktime * 1000).toISOString()}`;
                logs.push({
                  cmd: "classifyLocktime(locktime)",
                  out: `locktime: ${txJson.locktime} (${ref}), ${human}`,
                });
                stage = 1;
                draw();
                fin();
                return;
              };
              $("[data-runcode]", el).onclick = go;
            }
          };
          draw();
        },
      };
      const BLOCKS = {
        text: (b) => wrap(md(b.md)),
        aside: (b) => wrap(inline(b.md), "aside"),
        figure: (b) => {
          const el = document.createElement("figure");
          el.innerHTML =
            ASSETS[b.asset] + `<figcaption>${b.caption}</figcaption>`;
          return el;
        },
        table: (b) => {
          const el = document.createElement("div");
          el.className = "blk";
          el.innerHTML = `<table class="vtable"><thead><tr>${b.headers.map((x) => `<th>${x}</th>`).join("")}</tr></thead><tbody>${b.rows.map((r) => `<tr>${r.map((c) => `<td>${c}</td>`).join("")}</tr>`).join("")}</tbody></table>`;
          return el;
        },
        widget: (b) => {
          const el = wrap("");
          WIDGETS[b.name](el, () => done(b.id));
          return el;
        },
        reflect: (b) => {
          const el = wrap(
            `<div class="try"><span class="label">Write your report</span><p>${b.prompt}</p><textarea placeholder="${b.placeholder}"></textarea><button data-go>Compare with an example</button><div class="out"></div></div>`,
          );
          $("[data-go]", el).onclick = () => {
            $(".out", el).innerHTML =
              `<p>${b.model}</p><p class="small">Use this as a comparison, not something you need to copy word for word.</p>`;
            done(b.id);
          };
          return el;
        },
        next: () => {
          const n = L.next;
          return wrap(
            `<div class="label">Next lesson</div><h3>${n.id} ${n.title}</h3><p>${n.teaser}</p>`,
            "next",
          );
        },
      };
      $("#head").innerHTML =
        `<div class="kicker">${L.phase} · ${L.module}</div><h1>${L.title}</h1><p class="sub">${L.subtitle}</p><div class="meta">Lesson ${L.id} · about ${L.minutes} minutes · ${L.level}</div>`;
      const main = $("#lesson");
      L.sections.forEach((s) => {
        const sec = document.createElement("section");
        sec.id = s.id;
        sec.innerHTML = `<div class="label">${s.label}</div><h2>${s.title}</h2>`;
        s.blocks.forEach((b) => {
          if (BLOCKS[b.type]) sec.appendChild(BLOCKS[b.type](b));
        });
        main.appendChild(sec);
      });
      prog();
    </script>
    <script type="module" src="../../navigation.js"></script>
  </body>
</html>
