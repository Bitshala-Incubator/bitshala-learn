                "md": "Aarav has sent bitcoin a handful of times now. Type an address, type an amount, confirm. “What actually gets built and broadcast when I hit confirm?” he asks. “You showed me keys and seeds. But a *transaction*, what's actually inside one?”\n\nMeera opens a laptop. “Don't take my word for it. Let's not use a made-up example. Let's pull a real transaction that's already been sitting on the chain for years, and take it apart ourselves.”"

              {
                "type": "text",
                "md": "A transaction has **inputs** and **outputs**. Each output just says: this many satoshis, locked by this **script**. Simple enough. Each input is more interesting: it doesn't contain money directly, it points backward at a specific output of a specific earlier transaction, and proves the right to spend it. That pointer, which transaction and which output index, is called an **outpoint**. Spend that output, and your new outputs become the next outpoints someone else can point back at. The whole chain works this way, all the way back to the first block.\n\nTo prove the right to spend, an input carries unlocking data. There are two different places that data can live: a field called the **scriptSig**, carried inside the input itself, or a separate section at the end of the transaction called the **witness**. Which one a given transaction actually uses, and why that choice matters, is exactly what you're about to find out by pulling apart two real transactions, one from 2012 and one from after SegWit arrived."

determines the txid</text><text x="432" y="196" text-anchor="middle" stroke="none" font-size="8">outside the txid</text></svg>`,

      function prog() {

      async function runAsync(cmd, scope) {

            if (stage === 2)
              h += `<p>2. <code>tx</code> now holds the real response. Add up every output's value.</p><div class="labinput"><input id="cmd" placeholder="Type your expression here" aria-label="Command to total the outputs" autocomplete="off" spellcheck="false"><button data-run>Run</button></div><div class="msg" id="cmdmsg"></div>`;
            if (stage === 3)

            if (stage === 0) {

                  const claimed = tx.vin[0].prevout.value;
                  if (r !== claimed) {
                    m.textContent = `Got ${r}, but the prevout field claimed ${claimed}. Check the index.`;
                    return;
                  }
                  logs.push({
                    cmd,
                    out: `${r} sats, matches the prevout field exactly. Independently confirmed, not just trusted.`,
                  });
                  stage = 2;
                  draw();
                  return;
                }
                if (stage === 2) {
                  if (r !== tx.fee) {
                    m.textContent = `Got ${r}, but tx.fee reports ${tx.fee}. Check the subtraction.`;
                    return;
                  }
                  logs.push({ cmd, out: `${r} sats, matches tx.fee exactly` });
                  stage = 3;
                  draw();
                  fin();
                  return;
                }
              };
              $("[data-run]", el).onclick = go;
              $("#cmd", el).onkeydown = (e) => {
                if (e.key === "Enter") {
                  e.preventDefault();
                  go();
                }
              };
            }
          };
          draw();
        },
        ScriptCompare(el, fin) {
          el.classList.add("try");
          let stage = 0;
          const logs = [];
          const draw = () => {
            let h = '<span class="label">A second, independent explorer</span>';
            if (!tx) {
              gateListeners.add(draw);
              h += '<p class="msg pending">Complete Mission 1 first.</p>';
              el.innerHTML = h;
              return;
            }
            if (logs.length)
              h += `<div class="termbox">${logs.map((x) => terminalLine(x.cmd, x.out, x.err)).join("")}</div>`;
            if (stage === 0)
              h += `<p>1. <code>LEGACY_TXID</code> and <code>EXPLORER2</code> (blockstream.info) are already loaded. Fetch it.</p><div class="labinput"><input id="cmd" placeholder="Type your expression here" aria-label="Command to fetch the legacy transaction" autocomplete="off" spellcheck="false"><button data-run>Run</button></div><div class="msg" id="cmdmsg"></div>`;
            if (stage === 1)
              h += `<p>2. Compare how its first output is locked against this lesson's main transaction. The Esplora docs name the field that gives a script its type.</p><div class="labinput"><input id="cmd" placeholder="Type your expression here" aria-label="Command to read the legacy script type" autocomplete="off" spellcheck="false"><button data-run>Run</button></div><div class="msg" id="cmdmsg"></div>`;
            if (stage === 2)
              h += `<p class="msg">Same idea, amount plus a locking script, two completely different lock types, fetched from two independently-run explorers. Mission 3 of 4 done. One more look, then the report.</p>`;
            el.innerHTML = h;
            if (stage < 2) {
              const go = async () => {
                const cmd = $("#cmd", el).value.trim();
                const m = $("#cmdmsg", el);
                if (!cmd) {
                  m.textContent = "Type a command first.";
                  return;
                }
                if (stage === 0 && !/fetch\s*\(/.test(cmd)) {
                  m.textContent =
                    "Call fetch(...) against EXPLORER2 and LEGACY_TXID.";
                  return;
                }
                if (stage === 1 && !/legacyTx/.test(cmd)) {
                  m.textContent =
                    "Use legacyTx, the transaction you just fetched.";
                  return;
                }
                let r;
                try {
                  r = await runAsync(cmd, {
                    fetch,
                    EXPLORER2,
                    LEGACY_TXID,
                    legacyTx,
                  });
                } catch (e) {
                  m.textContent = networkErrorMsg(e);
                  return;
                }
                if (stage === 0) {
                  if (!r || !Array.isArray(r.vout) || r.txid !== LEGACY_TXID) {
                    m.textContent =
                      "That should fetch the transaction at LEGACY_TXID.";
                    return;
                  }
                  legacyTx = r;
                  logs.push({
                    cmd,
                    out: `fetched from blockstream.info, txid: ${r.txid}\nconfirmed in block ${r.status.block_height}`,
                  });
                  stage = 1;
                  draw();
                  notifyGates();
                  return;
                }
                if (stage === 1) {
                  const ours = tx.vout[0].scriptpubkey_type;
                  logs.push({
                    cmd,
                    out: `legacy: ${r}\nthis lesson's tx: ${ours}`,
                  });
                  stage = 2;
                  draw();
                  fin();
                  return;
                }
              };
              $("[data-run]", el).onclick = go;
              $("#cmd", el).onkeydown = (e) => {
                if (e.key === "Enter") {
                  e.preventDefault();
                  go();
                }
              };
            }
          };
          draw();
        },
        WitnessLook(el, fin) {
          el.classList.add("try");
          let stage = 0;
          const logs = [];
          const draw = () => {
            let h =
              '<span class="label">Where did the unlocking data actually go?</span>';
            if (!tx || !legacyTx) {
              gateListeners.add(draw);
              h +=
                '<p class="msg pending">Complete Missions 1 and 3 first. Both transactions need to be loaded.</p>';
              el.innerHTML = h;
              return;
            }
            if (logs.length)
              h += `<div class="termbox">${logs.map((x) => terminalLine(x.cmd, x.out, x.err)).join("")}</div>`;
            if (stage === 0)
              h += `<p>1. Look at this lesson's main (SegWit) transaction. What's in its witness?</p><div class="labinput"><input id="cmd" placeholder="Type your expression here" aria-label="Command to read the segwit witness" autocomplete="off" spellcheck="false"><button data-run>Run</button></div><div class="msg" id="cmdmsg"></div>`;
            if (stage === 1)
              h += `<p>2. Now the 2012 legacy transaction, same field.</p><div class="labinput"><input id="cmd" placeholder="Type your expression here" aria-label="Command to read the legacy witness" autocomplete="off" spellcheck="false"><button data-run>Run</button></div><div class="msg" id="cmdmsg"></div>`;
            if (stage === 2)
              h += `<p class="msg">The SegWit input's proof lives in a two-item witness array; its scriptSig is empty. The legacy input has no witness at all, its proof was always inside scriptSig. Mission 4 of 4 done. That's all four. On to the report.</p>`;
            el.innerHTML = h;
            if (stage < 2) {
              const go = () => {
                const cmd = $("#cmd", el).value.trim();
                const m = $("#cmdmsg", el);
                if (!cmd) {
                  m.textContent = "Type a command first.";
                  return;
                }
                let r;
                try {
                  r = new Function("tx", "legacyTx", `return (${cmd})`)(
                    tx,
                    legacyTx,
                  );
                } catch (e) {
                  m.textContent = "That line threw an error: " + e.message;
                  return;
                }
                if (stage === 0) {
                  if (!/\btx\b/.test(cmd) || !/witness/.test(cmd)) {
                    m.textContent = "Read tx.vin[0].witness.";
                    return;
                  }
                  logs.push({
                    cmd,
                    out: Array.isArray(r)
                      ? `[${r.length} item(s)]\n  ${r.map((x) => x.slice(0, 24) + "…").join("\n  ")}\nscriptSig: "${tx.vin[0].scriptsig}" (empty)`
                      : "undefined",
                  });
                  stage = 1;
                  draw();
                  return;
                }
                if (stage === 1) {
                  if (!/legacyTx/.test(cmd) || !/witness/.test(cmd)) {
                    m.textContent = "Read legacyTx.vin[0].witness.";
                    return;
                  }
                  logs.push({
                    cmd,
                    out:
                      r === undefined || !(r && r.length)
                        ? `undefined, no witness section at all\nscriptSig: present, ${legacyTx.vin[0].scriptsig.length / 2} bytes`
                        : JSON.stringify(r),
                  });
                  stage = 2;
                  draw();
                  fin();
                  return;
                }
              };
              $("[data-run]", el).onclick = go;
              $("#cmd", el).onkeydown = (e) => {
                if (e.key === "Enter") {
                  e.preventDefault();
                  go();
                }
              };
            }
          };
          draw();
        },
      };
      const BLOCKS = {
        text: (b) => wrap(md(b.md)),
        aside: (b) => wrap(inline(b.md), "aside"),
        figure: (b) => {
          const el = document.createElement("figure");
          el.innerHTML =
            ASSETS[b.asset] + `<figcaption>${b.caption}</figcaption>`;
          return el;
        },
        table: (b) => {
          const el = document.createElement("div");
          el.className = "blk";
          el.innerHTML = `<table class="vtable"><thead><tr>${b.headers.map((x) => `<th>${x}</th>`).join("")}</tr></thead><tbody>${b.rows.map((r) => `<tr>${r.map((c) => `<td>${c}</td>`).join("")}</tr>`).join("")}</tbody></table>`;
          return el;
        },
        widget: (b) => {
          const el = wrap("");
          WIDGETS[b.name](el, () => done(b.id));
          return el;
        },
        reflect: (b) => {
          const el = wrap(
            `<div class="try"><span class="label">Write your report</span><p>${b.prompt}</p><textarea placeholder="${b.placeholder}"></textarea><button data-go>Compare with an example</button><div class="out"></div></div>`,
          );
          $("[data-go]", el).onclick = () => {
            $(".out", el).innerHTML =
              `<p>${b.model}</p><p class="small">Use this as a comparison, not something you need to copy word for word.</p>`;
            done(b.id);
          };
          return el;
        },
        next: () => {
          const n = L.next;
          return wrap(
            `<div class="label">Next lesson</div><h3>${n.id} ${n.title}</h3><p>${n.teaser}</p>`,
            "next",
          );
        },
      };
      $("#head").innerHTML =
        `<div class="kicker">${L.phase} · ${L.module}</div><h1>${L.title}</h1><p class="sub">${L.subtitle}</p><div class="meta">Lesson ${L.id} · about ${L.minutes} minutes · ${L.level}</div>`;
      const main = $("#lesson");
      L.sections.forEach((s) => {
        const sec = document.createElement("section");
        sec.id = s.id;
        sec.innerHTML = `<div class="label">${s.label}</div><h2>${s.title}</h2>`;
        s.blocks.forEach((b) => {
          if (BLOCKS[b.type]) sec.appendChild(BLOCKS[b.type](b));
        });
        main.appendChild(sec);
      });
      $("#raw").textContent = JSON.stringify(L, null, 1);
      prog();
    </script>
    <script type="module" src="../../navigation.js"></script>
  </body>
</html>
