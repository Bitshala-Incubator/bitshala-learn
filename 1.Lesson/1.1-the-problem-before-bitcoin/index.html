  <body>
    <nav>
      <span>Bitshala Learn · Lesson 1.1</span><span id="prog"></span>
      <div id="bar"></div>

    <div class="wrap">

    <script type="application/json" id="lesson-data">
      {
        "id": "1.1",
        "title": "The Problem Before Bitcoin",
        "subtitle": "How do you make digital money behave like cash?",
        "phase": "Bitcoin Foundations",
        "module": "Introduction to Bitcoin",
        "minutes": 25,
        "level": "Beginner",
        "concepts": [
          "double-spending",
          "intermediary",
          "decentralisation",
          "bitcoin-purpose"
        ],
        "next": {
          "id": "1.2",
          "title": "Getting Started with Bitcoin",
          "teaser": "You now know the problem. Next you’ll stop reading about Bitcoin and start using it: wallets, addresses, sending, receiving, and how to recover it all if something goes wrong."
        },
        "sections": [
          {
            "id": "coin",
            "label": "The coin",
            "title": "A coin that lives on your computer",
            "blocks": [
              {
                "type": "text",
                "md": "Suppose Bitshala gives you a digital coin. Not a promise of one, and not a balance in an app, but an actual thing that sits on your computer and that you can hand to anyone on the internet. There is no bank in the middle, no payment company, no server keeping track.\n\nIt sounds like a good idea, and for about a minute it is. You send the coin to your friend Aarav. He receives it. Everybody is happy.\n\nThen you notice something small. The coin is still on your computer."
              },
              {
                "type": "text",
                "md": "That is just how digital things behave. When you “send” a photo, you send a copy and the original stays where it was. Nobody minds that with a photo. But this is money, so out of curiosity, send it again."
              },
              {
                "type": "widget",
                "id": "w-send",
                "name": "SendCoin",
                "props": {
                  "steps": [
                    {
                      "btn": "Send it to Aarav",
                      "line": "Aarav has your coin. Fine so far, except you still have it too."
                    },
                    {
                      "btn": "Now send it to Meera",
                      "line": "Meera has it as well. Nothing in the software stopped you."
                    },
                    {
                      "btn": "And to Kabir",
                      "line": "Kabir too. Three friends, each holding what looks like the same coin, each sure they were paid."
                    }
                  ]
                }
              },
              {
                "type": "text",
                "md": "At most one of them can really have been paid. The trouble is that nothing in the coin itself says which."
              },
              {
                "type": "aside",
                "md": "Before reading on, decide what you would do about this. You’ll compare notes with the rest of the lesson later."
              }
            ]
          },

          {
            "id": "copy",
            "label": "Why copies break money",
            "title": "Money has to be used up when it’s spent",
            "blocks": [
              {
                "type": "text",
                "md": "A photo can be copied, and so can a PDF, a voice note or a meme. That is what makes them so easy to share, and it is exactly what makes them useless as money, because money only works if spending it uses it up.\n\nCash does this without anyone thinking about it. Hand a ₹500 note to Aarav and it is no longer in your pocket. You cannot also hand that same note to Meera. The physical world enforces the rule for free.\n\nDigital things have no such rule, so someone has to add one. What goes wrong without it has a name: **double spending**, which means spending the same digital value more than once."
              },
              {
                "type": "figure",
                "asset": "fork",
                "caption": "One coin, two recipients. Both payments look perfectly genuine."
              },
              {
                "type": "text",
                "md": "Notice that nobody in this story has to be a cheat. Even an honest person’s software could send the same payment twice by accident. The real question is who, or what, decides which of the two payments counts."
              }
            ]
          },

          {
            "id": "maya",
            "label": "Someone to keep the score",
            "title": "Let’s hire a bookkeeper",
            "blocks": [
              {
                "type": "text",
                "md": "The obvious fix is to stop trusting the coin and start trusting a record. Pick someone reliable to keep a notebook of who owns what. Call her Maya.\n\nAt the start, Maya’s notebook says you have one coin. When you pay Aarav, she crosses it out under your name and writes it under his. When you then try to pay Meera with the same coin, she looks at the notebook, sees that you have nothing left, and refuses. Try to get past her."
              },
              {
                "type": "widget",
                "id": "w-ledger",
                "name": "Ledger",
                "props": {
                  "keeper": "Maya",
                  "owner": "You",
                  "payees": ["Aarav", "Meera"],
                  "coins": 1
                }
              },
              {
                "type": "text",
                "md": "It works, and it is more or less how the money in your bank account works today. Your bank is Maya, with better software and a much bigger notebook.\n\nBut look at what we actually did. We didn’t stop the coin from being copied. We handed the problem to Maya."
              }
            ]
          },

          {
            "id": "trust",
            "label": "The trouble with Maya",
            "title": "Everything now depends on one person",
            "blocks": [
              {
                "type": "text",
                "md": "As long as Maya is careful, honest, awake and available, none of this matters. The whole arrangement rests on those four things.\n\nShe might make a mistake, and a wrong number in her notebook becomes your wrong number. She might go offline, and then nobody can pay anybody. She might decide, for reasons she doesn’t owe you, not to process your payment. Or she might quietly change what the notebook says.\n\nNone of these is a technical failure. Each one is a question of trust, and trust is exactly what we were hoping to do without."
              },
              {
                "type": "aside",
                "md": "This is the trade-off at the centre of the lesson. A single record is easy to coordinate and easy to check, and it is also one place where everything can go wrong."
              }
            ]
          },

          {
            "id": "nomaya",
            "label": "A town with no Maya",
            "title": "So take Maya away",
            "blocks": [
              {
                "type": "text",
                "md": "Not replace her with someone else. Remove the role altogether.\n\nInstead of one notebook, imagine hundreds of independent people, each keeping their own copy of the record, and each checking every payment against the same set of rules. If you try to pay two people with one coin, whoever hears about it can look at their own notebook and see the coin is already gone. Nobody is in charge, but everybody is checking."
              },
              {
                "type": "figure",
                "asset": "network",
                "caption": "Many participants, no centre. In Bitcoin they are computers called nodes, and the shared rules are called the protocol."
              },
              {
                "type": "text",
                "md": "One thing is worth being precise about. “Nobody is in charge” does not mean “there are no rules.” The rules are the whole point. What changes is who enforces them: not one trusted party, but anyone who cares to check. That idea is called **decentralisation**."
              }
            ]
          },

          {
            "id": "question",
            "label": "The real question",
            "title": "Which notebook is right?",
            "blocks": [
              {
                "type": "text",
                "md": "If you have been paying attention, something has been bothering you. When hundreds of notebooks exist and two of them disagree about whether your coin was spent, which one is right?\n\nThat is the correct question, and it is a hard one. Getting a crowd of strangers to agree on a single history, without a referee, is the actual invention. It takes several ideas working together: transactions that anyone can verify, cryptography to prove who is allowed to spend what, a network to spread the news, and a way for everyone to settle on one shared record. We will meet them one at a time in the coming lessons.\n\nFor now, keep the order in mind. Bitcoin didn’t begin with a blockchain and then go looking for a use. It began with a problem, and everything else is part of the answer."
              }
            ]
          },

          {
            "id": "history",
            "label": "Where this came from",
            "title": "It didn’t come from nowhere",
            "blocks": [
              {
                "type": "text",
                "md": "For years before Bitcoin, researchers had been trying to build digital cash, and most designs ran into the same wall. To stop double spending, they needed someone in the middle."
              },
              {
                "type": "timeline",
                "items": [
                  {
                    "when": "October 2008",
                    "text": "A paper titled “Bitcoin: A Peer-to-Peer Electronic Cash System” is published under the name Satoshi Nakamoto, describing a way to do without that someone."
                  },
                  {
                    "when": "January 2009",
                    "text": "The Bitcoin network begins running."
                  }
                ]
              },
              {
                "type": "text",
                "md": "The dates matter less than the question that connects them: can digital value move directly between people, without a trusted middleman stopping it from being spent twice?"
              }
            ]
          },

          {
            "id": "design",
            "label": "Your turn",
            "title": "Now you’re the designer",
            "blocks": [
              {
                "type": "choice",
                "id": "c-design",
                "prompt": "You are designing a digital cash system with one rule: the same coin can never be spent twice. Three designs are on the table. Which would you investigate further?",
                "ask": "In a sentence or two, why?",
                "options": [
                  {
                    "key": "A",
                    "title": "One central server",
                    "desc": "A single authority keeps the ledger.",
                    "feedback": "This is simple, and it is how most payments work today. It also brings Maya, and the trust problem, straight back."
                  },
                  {
                    "key": "B",
                    "title": "Private ledgers",
                    "desc": "Everyone decides for themselves what happened.",
                    "feedback": "With this design nobody would ever agree who owns what. Ten ledgers, ten different stories."
                  },
                  {
                    "key": "C",
                    "title": "A shared network with common rules",
                    "desc": "Participants verify independently and keep a shared history.",
                    "feedback": "This is the direction Bitcoin takes."
                  }
                ],
                "after": "But even this isn’t a finished answer. A network still has to decide which transactions are valid, how its members talk to each other, how the order of payments is settled, and how everyone comes to agree. Those are the questions the rest of the course answers."
              }
            ]
          },

          {
            "id": "check",
            "label": "In your own words",
            "title": "Say it back",
            "blocks": [
              {
                "type": "quiz",
                "id": "qz-1",
                "questionIds": ["q-double", "q-intermediary", "q-decentral"]
              },
              {
                "type": "reflect",
                "id": "r-company",
                "prompt": "Last one, and this is the one that matters. A friend asks you: “Why can’t Bitcoin just have a company keep a database of everyone’s balance? Wouldn’t that be easier?” Answer in two or three plain sentences, without jargon.",
                "placeholder": "Write it as you would say it to a friend.",
                "model": "Here is one way to put it. A company database is easier, but it means everyone has to trust that company to keep the records right, stay online, and never change or block anything. Bitcoin spreads that checking across many participants who follow the same rules, so there is no single party you have to rely on."
              }
            ]
          },

          {
            "id": "end",
            "label": "Next",
            "title": "So how does Bitcoin actually do it?",
            "blocks": [
              {
                "type": "text",
                "md": "You now have the problem. Digital value can be copied, so something has to stop it being spent twice, and the usual answer is to trust one record-keeper. Bitcoin’s answer is to remove the record-keeper and let everyone check.\n\nWhat we haven’t shown you is how. That comes next."
              },
              { "type": "next" }
            ]
          }
        ]
      }
    </script>

    <script type="application/json" id="quiz-bank">
      [
        {
          "id": "q-double",
          "concept": "double-spending",
          "prompt": "Alice sends Bob 1 BTC and, using the same coin, sends Carol 1 BTC. What is the problem?",
          "options": [
            "Encryption",
            "Double spending",
            "Mining",
            "Wallet recovery"
          ],
          "answer": 1,
          "right": "Yes. The problem isn’t that there are two messages; it’s that both try to spend the same value.",
          "wrong": "Not quite. Look at what Alice does with the same value."
        },
        {
          "id": "q-intermediary",
          "concept": "intermediary",
          "prompt": "In a traditional digital payment system, who usually keeps the authoritative record?",
          "options": [
            "Every user separately",
            "A central intermediary",
            "Nobody",
            "The recipient"
          ],
          "answer": 1,
          "right": "Right. It is easy to coordinate, but everyone relies on that one keeper.",
          "wrong": "Not quite. Think back to Maya’s notebook."
        },
        {
          "id": "q-decentral",
          "concept": "decentralisation",
          "prompt": "Which of these best describes decentralisation?",
          "options": [
            "There are no rules",
            "One computer controls everything",
            "Participants independently verify against shared rules",
            "Nothing is recorded"
          ],
          "answer": 2,
          "right": "Yes. It isn’t rule-free; it just has no single controlling authority.",
          "wrong": "Not quite. Decentralised does not mean there are no rules."
        }
      ]
    </script>

    <script>
      const ASSETS = {
        fork: `<svg viewBox="0 0 520 200" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="260" cy="34" r="20"/><text x="260" y="39" text-anchor="middle" stroke="none">coin</text><path d="M248 54L120 128M272 54L400 128" stroke-dasharray="4 4"/><g><circle cx="110" cy="142" r="11"/><path d="M90 178c0-14 9-22 20-22s20 8 20 22"/><circle cx="410" cy="142" r="11"/><path d="M390 178c0-14 9-22 20-22s20 8 20 22"/></g><text x="110" y="196" text-anchor="middle" stroke="none">Aarav</text><text x="410" y="196" text-anchor="middle" stroke="none">Meera</text></svg>`,
        network: `<svg viewBox="0 0 420 200" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M70 100L150 40M70 100L150 160M150 40L270 50M150 160L270 150M270 50L350 100M270 150L350 100M150 40L150 160M270 50L270 150M150 40L270 150M150 160L270 50" opacity=".5"/>${[
          [70, 100],
          [150, 40],
          [150, 160],
          [270, 50],
          [270, 150],
          [350, 100],
        ]
          .map(
            (p) =>
              `<circle cx="${p[0]}" cy="${p[1]}" r="10" fill="var(--bg)"/>`,
          )
          .join("")}</svg>`,
      };
    </script>

    <script>
      const $ = (s, r = document) => r.querySelector(s);
      const L = JSON.parse($("#lesson-data").textContent),
        QB = Object.fromEntries(
          JSON.parse($("#quiz-bank").textContent).map((q) => [q.id, q]),
        );
      const KEY = "bitshala-learn:" + L.id;
      let P = {};
      try {
        P = JSON.parse(localStorage.getItem(KEY) || "{}");
      } catch (e) {}
      const inl = (s) =>
        s
          .replace(/\*\*(.+?)\*\*/g, "<b>$1</b>")
          .replace(/\*(.+?)\*/g, "<i>$1</i>");
      const md = (s) =>
        s
          .split("\n\n")
          .map((p) => `<p>${inl(p)}</p>`)
          .join("");
      const wrap = (h, c = "") => {
        const d = document.createElement("div");
        d.className = "blk " + c;
        d.innerHTML = h;
        return d;
      };
      const ACT = ["widget", "choice", "reflect"];
      const total = () =>
        L.sections
          .flatMap((s) => s.blocks)
          .reduce(
            (n, b) =>
              n +
              (b.type === "quiz"
                ? b.questionIds.length
                : ACT.includes(b.type)
                  ? 1
                  : 0),
            0,
          );
      function prog() {
        const n = Object.keys(P).length,
          t = total();
        $("#prog").textContent = n + " of " + t + " activities";
        $("#bar").style.width = (n / t) * 100 + "%";
      }
      function done(id) {
        if (P[id]) return;
        P[id] = 1;
        try {
          localStorage.setItem(KEY, JSON.stringify(P));
        } catch (e) {}
        prog();
      }

      const WIDGETS = {
        SendCoin(el, p, fin) {
          let n = 0;
          const draw = () => {
            const o = el.querySelector(".out");
            el.innerHTML = `<span class="label">Try it</span><div class="out">${o ? o.innerHTML : ""}</div><div>${n < p.steps.length ? `<button data-s>${p.steps[n].btn}</button>` : ""}<button class="ghost" data-r>Start over</button></div>`;
          };
          el.classList.add("try");
          draw();
          el.onclick = (e) => {
            if (e.target.dataset.s !== undefined) {
              el.querySelector(".out").insertAdjacentHTML(
                "beforeend",
                "<p>" + p.steps[n].line + "</p>",
              );
              n++;
              if (n === p.steps.length) fin();
              const h = el.querySelector(".out").innerHTML;
              draw();
              el.querySelector(".out").innerHTML = h;
            }
            if (e.target.dataset.r !== undefined) {
              n = 0;
              el.querySelector(".out").innerHTML = "";
              draw();
            }
          };
        },
        Ledger(el, p, fin) {
          el.classList.add("try");
          let b;
          const init = () => {
              b = [p.coins, ...p.payees.map((_) => 0)];
            },
            draw = (m) => {
              el.innerHTML = `<span class="label">Try it</span><table><tr><th>${p.keeper}’s notebook</th><th>Coins</th></tr>${[p.owner, ...p.payees].map((n, i) => `<tr><td>${n}</td><td>${b[i]}</td></tr>`).join("")}</table><div>${p.payees.map((n, i) => `<button data-i="${i + 1}">Pay ${n}</button>`).join("")}<button class="ghost" data-r>Start over</button></div><div class="msg">${m || ""}</div>`;
              el.querySelectorAll("[data-i]").forEach(
                (x) =>
                  (x.onclick = () => {
                    const i = +x.dataset.i;
                    if (b[0] >= 1) {
                      b[0]--;
                      b[i]++;
                      draw(p.keeper + ": “Done.”");
                    } else {
                      draw(
                        p.keeper +
                          ": “You have nothing left to pay with. Sorry.”",
                      );
                      fin();
                    }
                  }),
              );
              $("[data-r]", el).onclick = () => {
                init();
                draw();
              };
            };
          init();
          draw();
        },
      };

      const BLOCKS = {
        text: (b) => wrap(md(b.md)),
        aside: (b) => wrap(inl(b.md), "aside"),
        figure: (b) => {
          const a = ASSETS[b.asset];
          const el = document.createElement("figure");
          el.innerHTML =
            (/^(https?:|data:)/.test(a)
              ? `<img src="${a}" alt="${b.caption}" style="max-width:100%">`
              : a) + `<figcaption>${b.caption}</figcaption>`;
          return el;
        },
        timeline: (b) =>
          wrap(
            b.items.map((i) => `<div><b>${i.when}</b>${i.text}</div>`).join(""),
            "tl",
          ),
        widget: (b) => {
          const el = wrap("");
          WIDGETS[b.name](el, b.props || {}, () => done(b.id));
          return el;
        },
        choice: (b) => {
          const el = wrap(
            `<div class="try"><span class="label">Your turn</span>${md(b.prompt)}${b.options.map((o) => `<button class="opt" data-k="${o.key}"><b>${o.title}.</b> ${o.desc}</button>`).join("")}<textarea placeholder="${b.ask}"></textarea><button data-go>Show me</button><div class="out" style="margin-top:14px"></div></div>`,
          );
          let k = null;
          el.querySelectorAll(".opt").forEach(
            (x) =>
              (x.onclick = () => {
                k = x.dataset.k;
                el.querySelectorAll(".opt").forEach((y) =>
                  y.classList.toggle("right", y === x),
                );
              }),
          );
          $("[data-go]", el).onclick = () => {
            const o = b.options.find((o) => o.key === k);
            $(".out", el).innerHTML = o
              ? `<p><b>${o.feedback}</b></p><p>${b.after}</p>`
              : "<p><i>Choose a design first.</i></p>";
            if (o) done(b.id);
          };
          return el;
        },
        quiz: (b) => {
          const el = wrap(
            b.questionIds
              .map((id) => {
                const q = QB[id];
                return `<div class="q"><b>${q.prompt}</b>${q.options.map((t, j) => `<button class="opt" data-q="${id}" data-j="${j}">${t}</button>`).join("")}<div class="msg" id="f-${id}"></div></div>`;
              })
              .join(""),
          );
          el.querySelectorAll("[data-q]").forEach(
            (x) =>
              (x.onclick = () => {
                const q = QB[x.dataset.q],
                  ok = +x.dataset.j === q.answer;
                x.classList.add(ok ? "right" : "wrong");
                $("#f-" + q.id, el).textContent = ok ? q.right : q.wrong;
                if (ok) done("q:" + q.id);
              }),
          );
          return el;
        },
        reflect: (b) => {
          const el = wrap(
            `<div class="try">${md(b.prompt)}<textarea placeholder="${b.placeholder || ""}"></textarea><button data-go>Compare with ours</button><div class="out" style="margin-top:14px"></div></div>`,
          );
          $("[data-go]", el).onclick = () => {
            $(".out", el).innerHTML = `<p>${inl(b.model)}</p>`;
            done(b.id);
          };
          return el;
        },
        next: () => {
          const n = L.next;
          return wrap(
            `<span class="label">Next lesson</span><h3>${n.id} ${n.title}</h3><p>${n.teaser}</p><a class="next-link" href="../1.2-getting-started-with-bitcoin/">Start lesson ${n.id} →</a>`,
            "next",
          );
        },
      };

      const errs = [];
      L.sections.forEach((s) =>
        s.blocks.forEach((b) => {
          if (!BLOCKS[b.type])
            errs.push(s.id + ': unknown block "' + b.type + '"');
          if (b.type === "widget" && !WIDGETS[b.name])
            errs.push(s.id + ': unknown widget "' + b.name + '"');
          if (b.type === "figure" && !ASSETS[b.asset])
            errs.push(s.id + ': missing asset "' + b.asset + '"');
          if (b.type === "quiz")
            b.questionIds.forEach((q) => {
              if (!QB[q]) errs.push(s.id + ': missing question "' + q + '"');
            });
        }),
      );
      if (errs.length) {
        const w = $("#warn");
        w.style.display = "block";
        w.innerHTML = errs.join("<br>");
      }

      $("#head").innerHTML =
        `<div class="kicker">${L.phase} · ${L.module}</div><h1>${L.title}</h1><p class="sub">${L.subtitle}</p><div class="meta">Lesson ${L.id} · about ${L.minutes} minutes · ${L.level}</div>`;
      const main = $("#lesson");
      L.sections.forEach((s, i) => {
        const sec = document.createElement("section");
        sec.id = s.id;
        sec.innerHTML = `<div class="label">${s.label}</div><h2>${s.title}</h2>`;
        s.blocks.forEach((b) => {
          if (BLOCKS[b.type]) sec.appendChild(BLOCKS[b.type](b));
        });
        main.appendChild(sec);
      });
      prog();
    </script>
  </body>
</html>
